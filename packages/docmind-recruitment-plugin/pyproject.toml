[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind-recruitment-plugin"
version = "0.1.0"
description = "Recruitment domain plugin skeleton for DocMind"
requires-python = ">=3.12"
dependencies = ["docmind-domain-sdk==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
