problem_definition:
  missing_capability: >-
    公共请求协议缺少 request-local 的通用结构化参数通道，调用方只能传 query，
    插件只能依赖固定 DTO 字段。
  rejected_paths:
    - 把结构化规则拼进 query
    - 使用具体插件专用的 Host 参数
    - 复用 PluginStartRequest.config
    - 把调用方参数塞进 FocusContext
    - 增加含义宽泛的 metadata 或 context 字段
    - 为每个领域建立专用请求 DTO
    - 通过 kwargs、全局变量、环境变量或会话状态旁路传递
  reason: >-
    上述路径会混淆请求语义、生命周期配置、Host 内部上下文或插件状态，并破坏
    统一 Host 分发及未来 JSON transport 的稳定边界。

architecture_decision:
  decision: GO
  selected_contract: DomainRequest.options
  target_protocol: "1.1"
  rationale:
    - options 明确表达调用方本轮提供的可选结构化参数。
    - 字段保持领域无关，SDK 和 Host 不定义任何业务 key。
    - 默认空对象允许旧调用代码和现有 runner 不改调用方式。
    - 插件拥有业务 schema、业务校验和未知 key 策略。
  concept_separation:
    core_semantics:
      fields:
        - query
        - source_scope
        - focus
        - locale
      meaning: 请求的核心问题、授权来源与通用交互状态。
    caller_options:
      field: options
      meaning: 调用方只针对本次请求提供的可选结构化参数。
    host_execution_context:
      examples:
        - logger
        - trace span
        - timeout timer
        - transport connection
        - authentication object
      wire_behavior: 不进入 DomainRequest.options。
    capability_negotiation:
      examples:
        - supported protocol range
        - option schema declaration
        - transport permissions
      wire_behavior: 不由 options 承载，且不在首切片实现。

protocol_version_strategy:
  current_protocol: "1.0"
  target_protocol: "1.1"
  sdk_package_version_after_slice: 0.2.0
  package_and_protocol_versions_evolve_independently: true
  protocol_1_0:
    artifact_immutable: true
    path: packages/docmind-domain-sdk/src/docmind_domain_sdk/schemas/protocol-1.0.schema.json
    required_sha256: ef119f934d9a30794fa8aa429489e213fa4183abb1ee0e34f4ddd75550a52dc3
    behavior:
      - 不重新生成。
      - 不修改 title、$id、定义、空白、排序或结尾换行。
      - 保持 additionalProperties=false 和既有 $defs.JsonValue={} 作为历史事实。
  protocol_1_1:
    artifact: packages/docmind-domain-sdk/src/docmind_domain_sdk/schemas/protocol-1.1.schema.json
    schema_draft: "2020-12"
    schema_id: urn:docmind:domain-plugin-protocol:1.1
    default_protocol_version: "1.1"
    domain_request_accepted_versions:
      - "1.0"
      - "1.1"
    legacy_request_rule: >-
      protocol_version=1.0 的请求必须省略 options；只要输入中显式出现 options 字段，
      无论值为空对象还是非空内容，都必须拒绝。新 SDK 可将合法旧 1.0 请求在内存中
      归一为 request.options == {}，但这不表示 1.0 wire 协议拥有 options 字段；通过
      model_dump(mode="json")、model_dump_json() 或统一 wire dump helper 重新序列化为
      1.0 wire payload 时必须再次省略 options，并继续通过冻结的 1.0 Schema。
      protocol 1.0 artifact 不修改。
    other_top_level_messages: >-
      protocol 1.1 SDK 构造的其他顶层消息默认并固定为 1.1；本切片只对
      DomainRequest 定义 1.0 输入兼容读取。
  reason_for_minor_version: >-
    options 是可选的加法式请求字段，没有改变 DomainPlugin 方法集合或既有字段语义；
    但 1.0 additionalProperties=false 使新 wire 请求无法被旧接收方读取，因此必须
    发布 1.1 Schema，不能原地改写 1.0，也不需要升级到 2.0。

dto_contract:
  field_name: options
  conceptual_python_type: "Mapping[str, JsonValue]"
  concrete_sdk_storage: "dict[str, JsonValue]"
  wire_type: JSON object
  default_factory: dict
  default_behavior: >-
    调用方省略 options 时，DomainRequest.options 等于空对象；query、Host 调用次数、
    插件输出和普通检索回落均与当前行为一致。
  legacy_wire_exception: >-
    默认空对象是 protocol 1.1 和统一 Python 内存模型的行为，不代表 protocol 1.0 wire
    payload 可以携带空 options。protocol_version=1.0 的 wire 输入与输出均不得出现
    options 字段；显式 Python 构造 protocol_version="1.0", options={} 也必须拒绝，
    只有省略 options 的 1.0 构造或反序列化可以进入兼容读取路径。合法旧请求读取后即使
    request.options == {}，公共 wire 序列化结果仍必须省略 options。此处只冻结可观察
    契约，不规定 model_fields_set、前置 validator 或其他具体实现手段。
  json_value:
    public_sdk_type: JsonValue
    recursive_definition:
      scalar:
        - string
        - boolean
        - null
        - finite integer
        - finite number
      containers:
        - "list[JsonValue]"
        - "dict[str, JsonValue]"
    accepted_examples:
      - '{"flag": true}'
      - '{"count": 3, "ratio": 0.5}'
      - '{"nested": {"items": ["x", null]}}'
    forbidden_runtime_inputs:
      - pathlib.Path
      - bytes
      - bytearray
      - Decimal
      - set
      - frozenset
      - tuple
      - arbitrary object instance
      - callable
      - NaN
      - positive Infinity
      - negative Infinity
      - cyclic dict or list
      - non-string mapping key
    coercion_policy: >-
      禁止把上述非法 Python 输入静默转换为字符串、数字、列表或其他 JSON 值。
    schema_requirement: >-
      protocol 1.1 的 $defs.JsonValue 必须真实递归表达 object、array、string、boolean、
      null、integer 和 number；object.additionalProperties 与 array.items 必须递归引用
      JsonValue，禁止继续生成空 Schema {}。
  top_level_unknown_fields: forbid
  numbers:
    finite_only: true
    allow_nan: false
    allow_infinity: false
  input_isolation:
    required: true
    rules:
      - DomainRequest 不保存调用方原始 dict/list 的对象引用。
      - 构造完成后修改调用方原始任意层 dict/list 不得改变 request.options。
      - 反序列化和 Python 构造路径都必须产生独立的值树。
  plugin_read_only_convention:
    - 插件把 request.options 视为只读输入。
    - 首切片不引入递归不可变容器或 canonical immutable mapping。
    - StaticDomainHost 不依赖 plugin.execute 返回后被插件修改的 request.options。
    - 未来多插件 Host 必须为每个插件提供独立值树，禁止共享前一插件可污染的容器。
  equality:
    options_participates: true
    rules:
      - 其他字段相同但 options 不同的 DomainRequest 不相等。
      - 同值但 dict key 插入顺序不同的 options 不影响相等性。
  hash:
    public_contract: unsupported
    rules:
      - DomainRequest 不作为公共哈希键契约。
      - 加入结构化 options 后不保证实例可哈希。
      - 不实现 canonical __hash__。
      - 缓存、签名和去重不得使用 Python hash(request)。
      - 规范化 JSON 缓存键与请求签名属于后续独立切片。
  error_redaction:
    - protocol 1.1 WireModel 配置隐藏校验错误中的 input value。
    - 校验消息只包含失败类别和固定阈值，不包含完整 options、key 对应值或 Python repr。

security_quotas:
  ownership: >-
    SDK 定义固定协议常量和共享遍历校验；DomainRequest 构造时执行一次，Host 在
    plugin.execute 前通过公开请求边界校验再次执行，保证任何插件调用前完成拒绝。
  constants:
    max_encoded_bytes:
      name: MAX_OPTIONS_ENCODED_BYTES
      value: 16384
      unit: UTF-8 bytes
    max_container_depth:
      name: MAX_OPTIONS_DEPTH
      value: 8
    max_total_keys:
      name: MAX_OPTIONS_TOTAL_KEYS
      value: 128
    max_total_container_items:
      name: MAX_OPTIONS_CONTAINER_ITEMS
      value: 256
  canonical_size_measurement:
    encoder: json.dumps
    arguments:
      ensure_ascii: false
      allow_nan: false
      sort_keys: true
      separators: [",", ":"]
    measurement: compact canonical JSON 的 UTF-8 字节长度
  depth_definition: >-
    顶层 options object 深度为 1；每进入一个嵌套 object 或 array 深度加 1；
    scalar 不增加容器深度；任一路径容器深度大于 8 即超限。
  key_count_definition: >-
    统计整棵 options 值树所有 object 的 key 数之和，包含顶层 object；总数大于
    128 即超限。
  container_item_definition: >-
    对整棵值树的每个 object 和 array 累加 len(container)；object 的一个键值对计
    一个成员，array 的一个元素计一个成员；总数大于 256 即超限。
  cycle_detection: >-
    遍历器维护当前递归路径的容器对象身份；同一容器在当前路径再次出现时按循环引用
    拒绝，不把合法的值等价独立容器误判为循环。
  failure_behavior:
    dto_construction: >-
      原始输入在 DomainRequest 校验阶段失败，Pydantic ValidationError 隐藏 input value。
    host_boundary: >-
      validate_request_boundary 对超限或非法请求抛出 ProtocolViolationError；
      StaticDomainHost 在创建 execute coroutine 前调用该校验，插件调用次数保持为零。
    core_fallback: >-
      dispatch_domain_request 继续捕获端口异常并返回 None，保留原 query 进入现有通用检索。
    message_policy: >-
      错误消息只报告 encoded_bytes、depth、total_keys、container_items 或 invalid_json_type
      类别及对应固定上限，不包含 option key 名、值、完整 payload 或对象 repr。
  logging:
    - SDK 和 Host 默认不记录完整 options。
    - SDK 和 Host 默认不记录单个 option 值。
    - 本切片不新增 options 内容日志。
    - 测试捕获 stdout、stderr 和异常文本，确认合成敏感哨兵值不出现。
  configurability: >-
    首切片使用上述固定常量，不接配置中心、不读环境变量；配额可配置化列入独立后续切片。

responsibility_boundaries:
  sdk:
    owns:
      - protocol 1.1 版本常量和 Schema artifact
      - JsonValue 递归类型
      - DomainRequest.options 字段与默认空值
      - JSON 类型、有限数字、循环引用和固定配额校验
      - 调用方可变对象隔离
      - 未知顶层字段拒绝
      - validate_request_boundary 公共边界校验
    does_not_own:
      - 具体 option key
      - 插件业务枚举、范围或字段组合
      - 插件 option schema registry
      - Host 内部执行对象
  host:
    owns:
      - plugin.execute 前调用通用请求边界校验
      - 完整、值等价地转发 request.options
      - 协议错误安全回落
      - 不泄露 option 值的通用错误边界
    transparent_rules:
      - 不解释具体 key。
      - 不增加业务默认值。
      - 不删除、过滤或重命名 key。
      - 不修改 option value。
      - 不把 options 拼进 query。
      - 不把 options 自动拼进 prompt。
      - 不按领域、插件 ID、行业、岗位、公司或地域写判断。
      - 不为兼容 1.0 接收方静默剥离非空 options。
  plugin:
    owns:
      - 读取自己认识的 option。
      - 将 JSON 值转换成插件内部类型化业务模型。
      - 校验枚举、范围、缺失、冲突和组合关系。
      - 决定自身 schema 是否拒绝未知 key。
      - 缺少业务必需 option 时返回结构化 fatal_error 或明确 abstain。
      - 保持 options 只读。
    default_unknown_key_behavior: 插件可忽略自己不认识的 option，Host 不统一拒绝业务未知 key。
    does_not_require_host_semantics: true
  caller:
    owns:
      - 提供结构化 mapping。
      - 只发送本次请求所需参数。
      - 明确所使用插件能力的业务契约。
      - 不把 option 已传输等同于插件已支持该业务语义。
    forbidden_values_and_context:
      - 长期用户画像
      - 完整聊天历史
      - logger
      - 数据库连接
      - 文件句柄
      - 模型 client
      - Path 对象
      - API key
      - token
      - 其他凭据
      - Host 内部追踪对象
      - Host 内部执行对象
      - 插件启动期持久配置

compatibility_matrix:
  old_caller_to_new_sdk_and_host:
    construction: >-
      旧调用代码继续只传 request_id、query 和 source_scope 时可正常构造，options
      由 default_factory 归一为空对象。
    serialization: protocol 1.1 序列化包含值为空的 options，不改变其他字段值。
    runtime: StaticDomainHost 和现有插件按原调用次数执行。
    semantics: query、handled/abstain、回答文本与普通检索回落保持不变。
  new_caller_to_new_host_and_new_plugin:
    construction: 合法 JSON options 可构造并通过固定配额。
    serialization: model_dump、model_dump_json 与 model_validate_json 完整保留值。
    runtime: dispatch 和 Host 不投影、不删除、不改名，插件收到值等价 options。
    semantics: 插件自行解释业务内容，SDK 与 Host 不形成业务结论。
  new_caller_to_new_host_and_option_unaware_plugin:
    construction: 请求正常构造。
    serialization: options 仍完整保留到 Host 边界。
    runtime: >-
      插件源码运行在新 SDK 上且只读取既有字段时继续执行；合成插件测试只访问
      request.query 并忽略 request.options。
    semantics: >-
      只保证旧插件行为不被破坏，不保证调用方提供的 option 已生效，也不得宣称
      该插件已经支持相应业务能力。
  new_1_1_wire_request_to_old_1_0_receiver:
    construction: 新 SDK 可构造。
    serialization: 产生带 options 的 1.1 wire 请求。
    runtime: 旧 1.0 Schema 允许拒绝该请求，不提供前向兼容保证。
    semantics: 新 Host 不静默剥离非空 options，不伪装成功。
  protocol_1_0_request_to_protocol_1_1_receiver:
    construction: >-
      1.1 DomainRequest 模型接受 protocol_version=1.0 且缺失 options 的旧 payload；
      显式包含空 options 或非空 options 的 1.0 payload 均拒绝。省略 options 的显式
      Python 1.0 构造可进入兼容读取路径，显式传入 options={} 则拒绝。
    serialization: >-
      读取后内存对象允许 request.options == {}；通过 model_dump(mode="json")、
      model_dump_json() 或统一 wire dump helper 重新输出 1.0 wire payload 时必须省略
      options，原 query 和其他既有字段值保持不变，结果继续通过冻结的 1.0 Schema。
    runtime: 合法旧 1.0 请求可进入新 Host 和只读取既有字段的插件。
    semantics: >-
      合法旧请求等价于调用方没有提供 request-local options；不能把空 options 写入
      1.0 payload 后宣称该 payload 仍符合 protocol 1.0。
  forbidden_version_combination:
    construction: >-
      protocol_version=1.0 与任何显式 options 字段组合均拒绝，包括 options={}
      和任意非空内容；判断依据是字段是否出现，而不是值是否非空。
    serialization: >-
      合法 1.0 请求的公共 wire 序列化结果不得出现 options，并必须通过冻结的
      protocol-1.0.schema.json。
    runtime: 任何非法的 1.0 + 显式 options 请求都不得调用插件。
    semantics: >-
      1.1 能力不能降级标记为 1.0，内存默认空对象也不能解释为 1.0 wire 空 options 兼容。

first_slice_scope:
  domain_sdk:
    - 将 SDK package version 升级为 0.2.0，PROTOCOL_VERSION 升级为 1.1。
    - 定义并公开递归 JsonValue 类型。
    - 为 DomainRequest 增加默认空 options。
    - 支持读取不含 options 的 protocol 1.0 DomainRequest payload。
    - 拒绝 protocol_version=1.0 与任何显式 options 字段的组合，包括空对象。
    - 合法 1.0 请求读取后重新序列化时省略 options，保证输出继续符合冻结的 protocol 1.0 Schema。
    - 对 Python 输入执行无隐式非法类型转换的递归校验。
    - 对 options 执行输入对象隔离和固定安全配额校验。
    - 增加公开 validate_request_boundary 并复用 ProtocolViolationError。
    - 保持未知顶层字段拒绝。
    - options 参与 DTO 相等性，不提供公共哈希保证。
    - 在校验错误中隐藏 input value。
  schema:
    - 新增独立 protocol-1.1.schema.json。
    - 生成真实递归 $defs.JsonValue，禁止空 Schema。
    - >-
      让 1.1 DomainRequest Schema 表达 1.0 请求只允许缺失 options 的兼容分支，
      该分支禁止 options 属性出现；1.1 分支允许 options 并遵守递归 JsonValue 契约。
    - 保留 protocol-1.0.schema.json 的精确 SHA-256。
    - 调整生成器只生成或检查 1.1 artifact，不用新 DTO 重写 1.0 artifact。
    - wheel 同时包含 protocol 1.0 与 1.1 Schema。
  core_dispatch:
    - dispatch_domain_request 新增 keyword-only 可选 options 参数。
    - 省略参数时构造空 options。
    - 提供参数时完整交给 DomainRequest 构造校验。
    - request.query 继续逐字符等于传入 question。
    - 不添加领域逻辑、业务默认值或 query 拼接。
  host:
    - StaticDomainHost 在创建 plugin.execute coroutine 前调用 validate_request_boundary。
    - 合法请求以原对象或值等价对象交给插件。
    - options 不被投影、删除、过滤、改名或修改。
    - 超限请求不调用插件，并沿现有外层 helper 安全回落 None。
    - EmptyDomainHost 行为保持不变。
    - 不接入 describe、probe、动态发现或能力协商。
  package_compatibility:
    - 仅将招聘插件 pyproject 的 SDK 精确依赖同步为 docmind-domain-sdk==0.2.0。
    - >-
      仅将招聘插件 test_plugin_contract.py 中由 PROTOCOL_VERSION 驱动的 manifest
      schema_version 断言同步为 1.1，不修改测试场景、业务断言或 options 行为。
    - 不修改招聘插件 src、公开业务模型、识别、提取、比较、渲染或 execute 行为。
  documentation:
    - SDK README 记录 0.2.0、protocol 1.1、options 语义、配额和 1.0 artifact 保留策略。
    - ADR 对齐 protocol 1.1 已交付边界与 request-local options 例外，仍禁止插件私有状态进入 DTO。
  tests:
    - SDK DTO 与请求边界契约测试。
    - protocol 1.1 Schema artifact 与 protocol 1.0 不变测试。
    - dispatch 和 Host 透明传递测试。
    - 合成旧插件源码兼容测试。
    - 现有无 options SDK、Host、runner 和招聘插件回归。

non_goals:
  - ask_notes.py 命令行 JSON 参数
  - 面向最终用户的 options 输入方式
  - runner 新增 options 来源或会话状态
  - 招聘插件读取或使用 options
  - 显式求职规则业务接线
  - 修改现有 JD 比较业务
  - plugin option schema registry
  - manifest 声明 option schema
  - 完整 capability negotiation
  - describe、start、sync_sources、probe 或 stop 的生产接线
  - 动态插件发现、路由或多插件仲裁
  - namespaced extensions
  - MCP transport
  - UI 自动生成
  - options 驱动的业务缓存
  - canonical request 签名或哈希
  - 全面审计系统
  - 插件专用权限体系
  - 配额配置中心、环境变量覆盖或插件自定义协议配额
  - 递归不可变容器
  - 修改 protocol 1.0 Schema artifact
  - 在 SDK、Host 或 dispatch 中加入领域、行业、岗位、公司、地域或用户画像 key

