    当前 DomainRequest 只能承载 protocol_version、request_id、query、locale、
    source_scope、focus 和 deadline_ms，且所有 WireModel 都配置 extra=forbid。
  - >-
    当前显式规则比较能力已作为插件内部类型化服务存在，但 DomainPlugin.execute
    没有 request-local 结构化参数通道，调用方无法通过公共协议传入额外控制参数。
  - >-
    ADR 已固定“通用 Core + 领域无关 Host + 中立 SDK/线协议 + 独立领域插件”
    的依赖方向；结构化参数必须沿同一 DTO 边界传递，不能形成旁路耦合。
