test_matrix:
  sdk_unit_tests:
    - id: sdk-default-empty
      scenario: 省略 options 时 request.options 等于空对象。
    - id: sdk-old-call-source-compatibility
      scenario: 旧 DomainRequest 构造调用不新增实参即可通过。
    - id: sdk-json-round-trip
      scenario: 普通嵌套 JSON 经 model_dump_json 与 model_validate_json 完整往返。
    - id: sdk-valid-scalars
      scenario: 字符串、布尔、null、有限整数和有限浮点均合法。
    - id: sdk-invalid-python-types
      scenario: Path、bytes、bytearray、Decimal、set、frozenset、tuple、对象实例和 callable 均拒绝且不隐式转换。
    - id: sdk-nonfinite
      scenario: NaN、Infinity 和负 Infinity 均拒绝。
    - id: sdk-cycle
      scenario: 循环 dict 与循环 list 均拒绝，错误不回显输入值。
    - id: sdk-key-type
      scenario: 非字符串 key 拒绝。
    - id: sdk-extra-forbid
      scenario: 未知顶层 DomainRequest 字段继续拒绝。
    - id: sdk-caller-isolation
      scenario: 构造后修改调用方原始任意层 dict/list 不改变 request.options。
    - id: sdk-equality
      scenario: options 参与相等性，同值不同插入顺序相等，不同值不相等。
    - id: sdk-hash-contract
      scenario: 测试明确不依赖 hash(request)，带 dict/list options 的请求允许不可哈希。
    - id: sdk-legacy-request
      scenario: protocol_version=1.0 且缺失 options 的 payload 可读取并归一为空对象。
    - id: sdk-forbidden-version-combination
      scenario: >-
        protocol_version=1.0 与显式 options={} 或任意非空 options 的组合均拒绝；
        同时覆盖 wire payload 和显式 Python 构造入口。
    - id: sdk-legacy-reserialize
      scenario: >-
        从不含 options 的 1.0 JSON payload 读取后 request.options == {}；分别通过
        model_dump(mode="json") 与 model_dump_json()，以及仓库实际存在的统一 wire dump
        helper 重新序列化，输出均不存在 options key、继续通过冻结的 1.0 Schema，且
        query 和其他既有字段值保持不变。
    - id: sdk-quota-boundaries
      scenario: 四项固定配额分别覆盖刚好等于上限通过和超过上限拒绝。
    - id: sdk-redacted-errors
      scenario: 合成敏感哨兵值不出现在 ValidationError 文本。
  schema_artifact_tests:
    - id: schema-1-1-metadata
      scenario: protocol 1.1 Schema 使用 Draft 2020-12、固定 $id 和 x-protocol-version=1.1。
    - id: schema-recursive-json-value
      scenario: $defs.JsonValue 明确包含七类 JSON 类型且 object/array 递归引用自身。
    - id: schema-no-empty-json-value
      scenario: protocol 1.1 的 $defs.JsonValue 不等于 {}。
    - id: schema-options-default
      scenario: DomainRequest.options 是默认空 object，additionalProperties 递归引用 JsonValue。
    - id: schema-legacy-read
      scenario: 1.1 Schema 接受缺失 options 的 protocol_version=1.0 请求。
    - id: schema-no-fake-1-0-options
      scenario: >-
        1.1 Schema 的 1.0 兼容分支拒绝任何 options 属性出现，包括 options={} 和非空内容。
    - id: schema-legacy-round-trip
      scenario: >-
        新 SDK 重新序列化合法旧 1.0 请求得到的 payload 不含 options，并通过冻结的
        protocol-1.0.schema.json。
    - id: schema-new-wire-old-receiver
      scenario: protocol 1.0 Schema 对 1.1 非空 options 请求保持拒绝，明确不承诺前向兼容。
    - id: schema-1-0-immutable
      scenario: protocol-1.0.schema.json 的 SHA-256 精确等于冻结值。
    - id: schema-deterministic
      scenario: 1.1 artifact 确定性生成，--check 无漂移且不写 1.0 artifact。
    - id: schema-wheel-content
      scenario: wheel 同时包含 1.0、1.1 Schema 和 py.typed。
  host_and_dispatch_contract_tests:
    - id: dispatch-default-empty
      scenario: dispatch_domain_request 省略 options 时插件收到空对象。
    - id: dispatch-query-preservation
      scenario: 传入 options 前后 request.query 逐字符等于 question，不拼接或改写。
    - id: dispatch-value-preservation
      scenario: dispatch 构造的 request.options 与调用方合法输入值等价。
    - id: host-transparent-forwarding
      scenario: StaticDomainHost 将完整 options 原对象或值等价对象交给 plugin.execute。
    - id: host-unknown-business-keys
      scenario: 使用三个跨领域合成 key 证明 Host 不理解、过滤、删除、改名或修改业务 key。
    - id: host-option-unaware-plugin
      scenario: 只读取 query 的合成旧插件在新 SDK 上继续 execute 并维持原结果。
    - id: host-over-depth
      scenario: 超过深度上限时 execute 调用次数为零。
    - id: host-over-bytes
      scenario: 超过编码字节上限时 execute 调用次数为零。
    - id: host-over-keys
      scenario: 超过总 key 上限时 execute 调用次数为零。
    - id: host-over-items
      scenario: 超过总容器成员上限时 execute 调用次数为零。
    - id: host-redacted-failure
      scenario: 超限异常、stdout 和 stderr 不包含完整合成敏感 option 内容。
    - id: host-running-loop-order
      scenario: 既有运行 event loop 拒绝边界仍在创建 execute coroutine 前生效。
    - id: empty-host-zero-diff
      scenario: EmptyDomainHost 对合法请求仍返回 None 且无副作用。
  existing_regression_tests:
    - id: sdk-existing-contracts
      scenario: 现有 Domain SDK DTO、边界、Schema、公开 API 和分发测试全部通过。
    - id: host-existing-contracts
      scenario: 现有 Empty/Static Host、异常回落、最小 handled 和 normal retrieval 回归全部通过。
    - id: runner-no-options-path
      scenario: runner 继续使用两参数 helper 调用且行为不变，不修改 runner。
    - id: recruitment-plugin-no-options
      scenario: 招聘插件全部现有测试通过，无 options 时 handled/abstain 与 Markdown 输出不变。
    - id: full-tracked-regression
      scenario: 仓库全量 pytest 通过，warning 不过滤。

quality_gate:
  environment:
    - 使用 Linux Bash。
    - Python 使用 .venv/bin/python。
    - 测试显式设置仓库 SDK 与插件 src 的 PYTHONPATH。
    - 测试设置 PYTHONDONTWRITEBYTECODE=1 并关闭 pytest cache provider。
    - wheel 和临时安装产物只写入 mktemp -d，并由 trap 清理。
  commands:
    task_card_yaml: >-
      .venv/bin/python -c
      "from pathlib import Path; import yaml;
      p=Path('docs/task_card_domain_request_structured_options_protocol_1_1_first_slice.yaml');
      yaml.safe_load(p.read_text(encoding='utf-8'))"
    changed_python_py_compile: >-
      PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/docmind-domain-sdk/src
      .venv/bin/python -m py_compile
      packages/docmind-domain-sdk/src/docmind_domain_sdk/dto.py
      packages/docmind-domain-sdk/src/docmind_domain_sdk/validation.py
      packages/docmind-domain-sdk/src/docmind_domain_sdk/__init__.py
      packages/docmind-domain-sdk/src/docmind_domain_sdk/_version.py
      packages/docmind-domain-sdk/scripts/generate_json_schema.py
      packages/docmind-domain-sdk/scripts/check_wheel_contents.py
      app/domain_dispatch_port.py app/domain_host/host.py
    sdk_tests: >-
      PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/docmind-domain-sdk/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
      packages/docmind-domain-sdk/tests
    host_dispatch_tests: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
      public_tests/domain/test_domain_dispatch_port_empty_host.py
    recruitment_plugin_tests: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
      packages/docmind-recruitment-plugin/tests
    domain_public_regression: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
      public_tests/domain
    full_pytest: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
    schema_1_1_check: >-
      PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/docmind-domain-sdk/src
      .venv/bin/python packages/docmind-domain-sdk/scripts/generate_json_schema.py --check
    schema_1_0_hash: >-
      test "$(sha256sum
      packages/docmind-domain-sdk/src/docmind_domain_sdk/schemas/protocol-1.0.schema.json
      | awk '{print $1}')" =
      ef119f934d9a30794fa8aa429489e213fa4183abb1ee0e34f4ddd75550a52dc3
    build_and_wheel_check: >-
      SDK_OPTIONS_VERIFY_ROOT="$(mktemp -d)";
      export SDK_OPTIONS_VERIFY_ROOT;
      trap 'rm -rf "$SDK_OPTIONS_VERIFY_ROOT"' EXIT;
      .venv/bin/python -m build --wheel
      --outdir "$SDK_OPTIONS_VERIFY_ROOT/dist" packages/docmind-domain-sdk;
      .venv/bin/python packages/docmind-domain-sdk/scripts/check_wheel_contents.py
      "$SDK_OPTIONS_VERIFY_ROOT"/dist/*.whl
    encoding: >-
      .venv/bin/python packages/docmind-domain-sdk/scripts/check_text_encoding.py
      packages/docmind-domain-sdk app/domain_dispatch_port.py app/domain_host/host.py
      public_tests/domain/test_domain_dispatch_port_empty_host.py
      docs/adr/0001-domain-plugin-boundary-and-future-mcp-adapter.md
    mojibake: >-
      ! rg -n
      "AI鍥炵瓟|馃|鈴憋笍|鈿狅笍|褰撳墠杩樻病鏈|锛\\?|銆\\?"
      packages/docmind-domain-sdk app public_tests/domain
    domain_neutrality: >-
      ! rg -n
      "recruitment|招聘|JD|候选人|岗位|公司|地域"
      packages/docmind-domain-sdk/src app/domain_dispatch_port.py app/domain_host/host.py
    no_protected_diff: >-
      test -z "$(git diff --name-only --
      packages/docmind-domain-sdk/src/docmind_domain_sdk/schemas/protocol-1.0.schema.json
      ask_notes.py app/chat_loop_parts/runner.py bootstrap ai retrieval infra
      packages/docmind-recruitment-plugin/src
      packages/docmind-recruitment-plugin/tests/test_rule_comparison.py
      requirements.txt)"
    whitespace: git diff --check
  required_results:
    - 所有新增和修改 Python 文件通过 py_compile。
    - SDK 契约、Host/dispatch 契约、domain public regression 和招聘插件测试全部通过。
    - 全量 pytest 通过，warning 不过滤。
    - protocol 1.1 Schema 确定性生成且 $defs.JsonValue 不是空 Schema。
    - protocol 1.0 artifact SHA-256 与冻结值一致。
    - wheel 同时包含 1.0、1.1 Schema 和 py.typed。
    - 错误、stdout、stderr 和默认日志不回显合成敏感 option 值。
    - SDK、dispatch 和 Host 通过领域词扫描。
    - ask_notes.py、runner、composition、插件业务源码和 protocol 1.0 artifact 无差异。
    - git diff --check 通过。
  verification_order:
    - py_compile
    - SDK 单元与边界测试
    - Schema artifact 与 1.0 hash 测试
    - Host/dispatch 契约测试
    - 招聘插件无 options 回归
    - domain public regression
    - protocol 1.1 Schema --check
    - wheel 构建与内容检查
    - 编码、乱码、领域中立和受保护路径检查
    - 全量 pytest
    - git diff --check 与最终状态检查

acceptance_min:
  - PROTOCOL_VERSION 为 1.1，SDK package version 为 0.2.0，二者继续独立管理。
  - DomainRequest 提供默认空 options，并读取不含 options 的 1.0 请求。
  - >-
    protocol_version=1.0 时，只要输入中出现 options 字段，无论空或非空，DTO 与
    protocol 1.1 Schema 的 1.0 分支都拒绝；合法 1.0 请求重新序列化时省略 options，
    并通过冻结的 protocol 1.0 Schema。
  - JsonValue 运行时只接受递归 JSON 值，不隐式接收 Path、bytes、Decimal、set、tuple、对象或 callable。
  - protocol 1.1 Schema 真实递归表达 JsonValue，protocol 1.0 artifact 精确不变。
  - options 满足 16 KiB、深度 8、总 key 128 和总容器成员 256 四项固定边界。
  - 调用方原始可变对象与 DTO 值树隔离，options 参与相等性且不承诺可哈希。
  - dispatch 不改写 query，Host 不解释、过滤、修改或记录完整 options。
  - 超限请求在 plugin.execute 前拒绝，错误与日志不回显 option 值，外层安全回落保持不变。
  - 不认识 options 且只读取旧字段的合成插件继续执行，但不宣称支持 option 业务语义。
  - 无 options 的 SDK、Host、runner 和招聘插件行为保持不变。
  - 首切片不包含 CLI、业务插件接线、schema registry、能力协商、动态发现或 MCP。

completion_line:
  implementation_complete_when:
    - expected_modified_files 中的协议、传递、安全和文档改动全部完成。
    - protected_files_and_paths 无差异，protocol 1.0 SHA-256 精确匹配。
    - test_matrix 的全部场景均由自动测试覆盖并通过。
    - quality_gate.required_results 全部满足。
    - 最终工作区仅包含本切片授权文件且提交后干净。
  incomplete_if:
    - 只在 DTO 增加 dict 字段但没有递归运行时校验或有效递归 Schema。
    - 只验证 SDK 而没有 dispatch 与 Host 透明传递测试。
    - 通过改写 query、复用 config/focus 或增加插件专用 Host 参数传递。
    - >-
      修改 protocol 1.0 artifact、用 1.0 标记携带任何 options 字段（包括空对象），
      或合法 1.0 请求重新序列化后出现 options 字段。
    - 超限请求仍能调用插件或错误中泄露 option 值。
    - 无 options 现有行为未通过回归。

follow_up_slices:
  record_only: true
  implementation_in_first_slice: forbidden
  items:
    - 面向 CLI 或其他最终用户调用方的结构化 options 输入设计
    - 具体领域插件的 option schema、类型转换与业务接线
    - manifest option schema 声明与调用方发现
    - 完整 protocol capability negotiation
    - 动态多插件环境下的 option 定向与隔离
    - namespaced extensions 再评估
    - MCP transport 的 protocol 1.1 映射
    - 规范化 JSON 缓存键、请求签名与重放语义
    - 安全配额可配置化与集中审计

commit_boundary:
  task_card_commit:
    subject: "docs(domain-sdk): 定稿结构化 options 协议 1.1 首切片任务卡"
    body:
      - "目标: 冻结 DomainRequest 通用结构化 options 的 protocol 1.1 最小实现与兼容边界。"
      - "手段: 明确递归 JSON 契约、安全配额、透明传递、测试矩阵和严格非目标。"
    files:
      - docs/task_card_domain_request_structured_options_protocol_1_1_first_slice.yaml
    push: forbidden
  future_implementation_commit:
    subject: "feat(domain-sdk): 传递 protocol 1.1 结构化 options"
    body_requirements:
      - 标题与任务目标关键词对齐。
      - 正文至少包含可验证的目标和手段条目。
      - 不与其他领域业务或 Host 治理切片混合提交。
    push: forbidden
  rollback:
    method: revert 对应独立提交
    forbidden_methods:
      - reset
      - restore
      - stash
      - clean

deliverables:
  current_run:
    - 定稿任务卡
    - YAML、diff 和 docs-only 范围验证记录
    - 本地 docs 提交
  future_implementation:
    - protocol 1.1 SDK 与双 Schema artifact
    - dispatch 和 StaticDomainHost 透明传递
    - 固定安全配额与脱敏失败边界
    - SDK、Schema、Host/dispatch 和现有回归测试
    - SDK README 与 ADR 对齐
