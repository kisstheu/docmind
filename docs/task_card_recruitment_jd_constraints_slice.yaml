implementation_permissions:
  current_task:
    allowed:
      - 只修订 docs/task_card_recruitment_jd_constraints_slice.yaml
    forbidden:
      - 执行 A、B1 或 B2
      - 创建临时验证脚本、正式插件文件、生产代码或测试
      - 修改 requirements.txt 或 ask_notes.py
  immediately_after_card_validation:
    allowed:
      - A_input_reaches_domain_dispatch
      - B1_independent_package_boundary_probe
    repository_writes_allowed: false
    forbidden:
      - 创建 packages/docmind-recruitment-plugin
      - 修改 requirements.txt 或 ask_notes.py
      - 实现任何招聘领域逻辑
  after_A_and_B1_pass:
    automatic_permission: none
    required_action: 申请或获得新的实施授权
  after_A_and_B1_pass_and_new_authorization:
    allowed:
      - 创建 implementation_scope.phase_scope.B2_real_skeleton 中列出的正式 package skeleton
      - 执行 B2_real_package_skeleton_verification
      - 必要时按任务卡规则安全追加 requirements.txt 本地包入口
    forbidden_until_B2_pass:
      - JD 识别、字段抽取和 Markdown handled
      - 招聘领域规则和领域行为测试
      - public runner/Host 边界测试
      - ask_notes.py production 静态注入
  after_B2_pass:
    allowed:
      - 正式招聘领域逻辑实现
      - 插件招聘领域单元测试
      - StaticDomainHost/runner 边界测试
      - ask_notes.py 静态注入
  plugin_implementation_requires_new_user_authorization: true
  git_add_allowed: false
  commit_allowed: false
  push_allowed: false
  pull_request_allowed: false

