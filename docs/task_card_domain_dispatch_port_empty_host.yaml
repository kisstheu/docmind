version: 1

task_goal: >-
  在不改变 DocMind 现有用户可观察行为的前提下，建立 Core 可依赖的中立
  DomainDispatchPort，由现有 composition root 创建并注入一个不注册、不发现、
  不调用任何领域插件的空 Domain Host；无插件时原问句、Source 范围、路由、
  会话状态、回答、文件操作和检索链路保持零差异。

non_goals:
  - 招聘领域插件或任何具体领域插件
  - 中立契约测试插件、fake plugin 或合成插件执行链
  - 动态插件发现、静态插件注册表或 Python entry point 扫描
  - 插件 describe、start、sync_sources、probe、execute、stop 生命周期调用
  - SourceCatalog、SourceSync、SourceRef revision 生成或 Source 内容 DTO 转换
  - PluginInteractionState、OpaqueFocus 写回或现有 ConversationState 字段迁移
  - MCP Server、MCP Adapter、MCP transport 或远程 endpoint
  - 超时、重试、熔断、并发、冲突仲裁和完整运行时治理
  - 插件配置界面、权限界面或插件存储
  - 消费 handled DomainResult、呈现插件回答或应用 FocusUpdate
  - 重构整个 runner、状态机、路由、检索链路或文件操作链路
  - 修改 SDK protocol 1.0 的公开 API、DTO、Schema 或校验函数
  - 修改 ADR、README、演进记录或简历，并宣称“插件化已经完成”
  - 把 SDK 发布到公共/私有制品仓库，或引入 requirements.txt 之外的第二套根依赖管理体系

communication_preference:
  tone: professional_warm
  verbosity: standard

inputs:
  notes_dir: examples/demo_notes_public
  cache_file: ""
  change_log_file: ""
  emb_model: BAAI/bge-large-zh-v1.5
  llm_model: gemini-2.5-flash
  repository_root: /home/kissyu/projects/docmind
  shell: bash
  python_interpreter: .venv/bin/python
  expected_branch: arch/domain-plugin-spike
  expected_head: 94c8a6f6a78e77d792078f4891bb164771e776e4
  adr_path: docs/adr/0001-domain-plugin-boundary-and-future-mcp-adapter.md
  sdk_task_card_path: docs/task_card_domain_sdk_protocol_1_0.yaml
  sdk_package_path: packages/docmind-domain-sdk
  root_dependency_file: requirements.txt
  root_install_command: .venv/bin/python -m pip install -r requirements.txt
  sdk_requirement_line: ./packages/docmind-domain-sdk
  requirements_encoding: UTF-16LE with BOM and CRLF
  task_card_path: docs/task_card_domain_dispatch_port_empty_host.yaml
  production_cli: ask_notes.py

exploration_decision:
  additional_exploration_required: false
  evidence:
    - ADR 已确定 Core -> 中立端口、composition root -> 具体 Host、Host/SDK 不依赖具体领域实现的方向。
    - 独立 SDK protocol 1.0 已完成，公开 DTO、DomainPlugin 和五个边界校验函数已有唯一权威实现。
    - 根项目唯一 tracked 依赖入口为 requirements.txt，且当前 pip 已验证可从候选本地路径行解析 SDK。
    - 当前分支已只读核对实际入口、runner、Source 约束、状态写回和相关测试，不需要用实现 spike 猜测接入点。
  boundary: >-
    本卡只完成“可注入但必定未处理”的影子接线；Source DTO 转换、插件调用、
    handled 结果消费和插件状态写回均留到后续任务卡。

scope_resolution:
  adr_sequence_difference:
    fact: >-
      ADR 第 17 节第 3 步把“空 Host 接入”概括为同时接发现、生命周期和熔断；
      本任务授权明确要求 Host 不注册、不发现、不调用插件，并把完整运行时治理列为非目标。
    selected_option: >-
      将 ADR 第 3 步保守拆为 3a“DomainDispatchPort + 空 Host 影子接线”和后续
      3b“发现、生命周期与运行时治理”；本卡执行 3a，不修改 ADR。
    reason: 最小、可回滚，且不会为满足文档概括而扩大本次授权范围。
  sdk_runtime_availability:
    fact: >-
      当前 .venv 不能直接 import docmind_domain_sdk；SDK 位于独立 src-layout 包，
      根目录不存在 pyproject.toml、Pipfile、Poetry、uv 或 Conda 依赖入口；README
      唯一安装命令为 pip install -r requirements.txt，因此 requirements.txt 是当前
      根项目权威 tracked 运行时依赖入口，但尚未声明该本地包。
    verified_pip_behavior: >-
      已用当前 pip 26.1 对完整现有 requirements 内容加候选行做 --dry-run 验证；
      非 editable 行 ./packages/docmind-domain-sdk 可从仓库根目录解析
      packages/docmind-domain-sdk/pyproject.toml，并计划安装 docmind-domain-sdk==0.1.0，
      未修改 .venv，未在 SDK 源码树产生 build、dist、egg-info 或 __pycache__。
    selected_option: >-
      在 requirements.txt 末尾最小新增且仅新增一行 ./packages/docmind-domain-sdk，
      保持现有 UTF-16LE BOM、CRLF 和其他依赖行逐字符不变；不使用 -e、绝对路径、
      PYTHONPATH、手动 SDK 安装或当前 .venv 状态作为生产依赖方案。
    installation_contract: >-
      安装命令必须从仓库根目录执行 python -m pip install -r requirements.txt；
      pip 由 tracked requirements 自动构建并非 editable 安装本地 SDK。
      干净环境验收不得额外执行 pip install packages/docmind-domain-sdk。
    adr_follow_up: >-
      ADR 第 3 步拆为 3a/3b 继续作为后续文档任务，本卡不修改 ADR，且该文档更新
      不是当前实施阻塞项。

privacy_guard:
  enabled: true
  use_synthetic_examples_in_tests: true
  allow_public_demo_notes_for_cli_regression: true
  forbid_real_personal_or_company_sensitive_data: true
  tracked_text_scan_only: true
  rules:
    - 新增测试仅使用某公司A、候选人X、name@example.com 等脱敏值或公开 demo 数据。
    - 不把 test_notes、真实日志、完整联系方式、完整地址或本地绝对数据路径写入任务产物。
    - test_notes/ 和 tests/ 保持本地隐私/回归目录，不进入暂存区。

mechanism_constraints:
  - 必须复用 SDK 顶层公开 DTO，不允许硬编码具体领域结论或复制协议模型。
  - SDK 运行时依赖必须由 tracked requirements.txt 中的 ./packages/docmind-domain-sdk 可复现声明。
  - 不得靠当前 .venv、PYTHONPATH、editable install 或单独手动安装 SDK 掩盖依赖缺失。
  - 只增加一个同步中立端口、一个空实现和一条 composition-root 注入链。
  - 空 Host 默认静默且只返回 None，不用配置、日志或伪结果模拟未来能力。
  - 既有 Core 路由、Source 限定、状态机、检索和文件操作实现保持原样。
  - 普通用户不可见调试能力；本卡不新增调试开关或可见提示。

repository_facts:
  existing_similar_boundary:
    exists: false
    verification: >-
      全仓搜索仅在 ADR、SDK 任务卡和 SDK DomainPlugin 中命中相关术语；
      生产代码不存在 DomainDispatchPort、DomainHost、DomainPluginHost、
      domain_dispatch 或等价注入参数。
  composition_root:
    file: ask_notes.py
    symbol: main
    facts:
      - main 在 scan_repository 与 load_or_build_embeddings 后得到 RepoState。
      - main 是生产代码中唯一调用 app.chat_loop.run_chat_loop 的位置。
      - app.chat_loop.run_chat_loop 仅以 *args/**kwargs 转发到 app.chat_loop_parts.runner.run_chat_loop。
    approved_creation_point: >-
      RepoState 构建完成后、输出“系统就绪”并调用 run_chat_loop 之前创建空 Host；
      Host 构造不得接收 RepoState、模型 client、logger、数据库连接或 Source 内容。
  core_dispatch_injection:
    file: app/chat_loop_parts/runner.py
    symbol: run_chat_loop
    approved_point: >-
      文件操作、contextless follow-up、system_capability、repo_meta、smalltalk、
      out_of_scope 等既有守门均未处理，代码即将进入“# 5) normal retrieval”时；
      必须位于现有 normal retrieval 状态赋值、query 构建和 build_retrieval_materials
      之前，不得前移到通用守门之前。
  source_scope:
    facts:
      - app/chat_loop_parts/runner.py 先解析 category_scope_paths，并原样传给 build_retrieval_materials 的 allowed_paths。
      - app/retrieval_flow/materials.py 再把 selected_source_files 与 allowed_paths 交集为 effective_allowed_paths。
      - 当前 RepoState、path 列表和 chunk 索引不是 SDK DTO，且尚无稳定 SourceRef revision 适配器。
    approved_slice_behavior: >-
      本卡创建的 DomainRequest.source_scope 固定为空元组，表示空 Host 未获任何 Source；
      不把空元组解释为修改 Core 检索范围。既有 allowed_paths、selected_source_files、
      current_focus_file、last_relevant_indices 和 perform_retrieval 参数必须逐值保持。
  state_writeback:
    files:
      - app/dialog/state_machine.py
      - app/chat_state_helpers.py
      - app/chat_loop_parts/runner.py
    facts:
      - ConversationState 当前由 app.chat_loop 模块级 conversation_state 持有。
      - 本地回答通过 update_state_after_local_answer 写回。
      - 检索回答通过 update_state_after_retrieval_answer 写回。
    approved_slice_behavior: >-
      空 Host 不新增状态字段、不调用现有状态写回函数、不改变写回时序；
      Host 调用前后的状态仅由后续原 Core 链路按现有语义变化。

architecture_contract:
  dependency_direction:
    - app/chat_loop_parts/runner.py 只 import Core 可见的 app.domain_dispatch_port，不 import 具体 Host。
    - app.domain_dispatch_port 只依赖 typing/标准库和 docmind_domain_sdk 顶层公开 API。
    - bootstrap.domain_composition 可依赖具体空 Host，并由 ask_notes.py 调用。
    - 具体空 Host 实现 DomainDispatchPort，可依赖 SDK 顶层公开 API，但不得依赖 ai、retrieval、infra 或具体领域包。
    - Core、Host、SDK 均不得 import 招聘或其他具体领域实现、插件发现机制或 MCP transport。
    - packages/docmind-domain-sdk 不得反向 import app、ai、retrieval、infra、bootstrap 或 loaders。
  core_port:
    owner: DocMind Core application boundary
    file: app/domain_dispatch_port.py
    name: DomainDispatchPort
    shape:
      kind: runtime_checkable Protocol
      method: dispatch
      execution: synchronous
      input: docmind_domain_sdk.DomainRequest
      output: docmind_domain_sdk.DomainResult | None
    rationale: >-
      当前 runner 是同步循环；本卡不得为了空 Host 把 runner 或状态机改为 async。
      后续具体 Host 自行封装 async DomainPlugin 调用，不把 SDK DomainPlugin 直接暴露给 Core。
  empty_host:
    file: app/domain_host/host.py
    name: EmptyDomainHost
    behavior:
      - 满足 DomainDispatchPort 结构契约。
      - dispatch 对任意合法 DomainRequest 只返回 None。
      - 不维护插件列表、不读取 entry point、不动态 import、不访问配置、不调用 DomainPlugin。
      - 不生成 DomainResult、ProbeResult、PluginError、answer、evidence、focus 或伪 abstain DTO。
      - 不打印、不记录新日志、不写状态、不写磁盘、不改变 request。
  composition_factory:
    file: bootstrap/domain_composition.py
    name: create_domain_host
    output: DomainDispatchPort
    behavior: 只构造并返回 EmptyDomainHost，不接收或发现插件。
  sdk_dto_ownership:
    owner: packages/docmind-domain-sdk/src/docmind_domain_sdk
    allowed_public_dto:
      - DomainRequest
      - DomainResult
    rules:
      - 不在 app、bootstrap 或测试中复制第二份 DomainRequest、DomainResult、SourceRef、FocusContext 或协议校验逻辑。
      - 不修改 SDK DTO、DomainPlugin、JSON Schema、PROTOCOL_VERSION 或五个 boundary validator。
      - Core 只从 docmind_domain_sdk 顶层公开 API 引用 DTO，不 import dto.py、validation.py 等私有模块路径。
  conversion_boundary:
    current_slice:
      owner: app.domain_dispatch_port 的 Core 边界 helper
      input: runner 已有的规范化 question；不得使用 route_question_input、search_query 或插件生成文本替代。
      output: >-
        新建 DomainRequest，query 逐字符等于当前 Core question，source_scope=()，
        focus 使用 SDK 默认空值，request_id 为仅用于关联的中立随机 ID；
        不向 SDK DTO 塞入 ChatState、RepoState、Path、chunk、模型 client 或 logger。
    deferred:
      - SourceRef/SourceSnapshot 的构造、revision 计算与权限裁剪由后续 Source 边界任务在 Host 侧适配。
      - DomainResult 的完整 boundary validation 由后续存在真实/合成插件调用的 Host 任务复用 SDK validator。
      - FocusUpdate 到未来 PluginInteractionState 的转换不在本卡实现。
  fallback_boundary:
    rules:
      - DomainDispatchPort.dispatch 返回 None 时，无条件继续原 Core normal retrieval 链路。
      - dispatch 抛出 Exception 时在端口调用局部捕获，丢弃异常侧产物并继续原 Core 链路；不得落入 runner 最外层导致本轮回答被吞掉。
      - 返回值不是 SDK DomainResult、状态非法或本卡不消费的任何非空结果时，一律视为未处理并继续原 Core 链路。
      - 本卡即使收到合法 handled DomainResult 也不得呈现、写状态或截断 Core；消费 handled 结果属于后续契约插件切片。
      - 回落必须继续使用进入 dispatch 前的 question、既有 Source 约束和通用会话上下文。
      - 回落不得混入 Host 的部分答案、改写 query、Evidence、FocusUpdate 或错误提示。
    hard_acceptance_focus: 空 Host / 无插件只返回 None 的路径。
    deferred_validation: >-
      request_id/plugin_id、Evidence/Focus Source 越界、非法状态组合等完整非法插件结果验证，
      必须在后续中立契约插件或 fake plugin 任务中复用 SDK validator 验证；不得为此扩大本卡。

no_plugin_semantics:
  - 原始 raw_question 仍只按现有 normalize_colloquial_question 规则得到 question；Host 不再改写或吞掉 question。
  - route_info、route_question_input 和最终 route 的计算、守门顺序与选择结果不变。
  - category_scope_paths、selected_source_files、effective_allowed_paths 和 relevant_indices 语义不变。
  - ConversationState、current_focus_file、last_relevant_indices 和 memory_buffer 更新时序不变。
  - 普通回答、repo meta、本地直答、检索、远程生成和文件操作仍由原 Core 处理。
  - 空 Host 不返回伪结果，None 或异常不得覆盖已有/后续 Core 结果。
  - 不增加用户提示、欢迎语、回答前缀、错误提示、stdout/stderr 行或默认日志行。
  - 不增加 [远程模型生成] 标记；只有原 Core 实际调用远程模型时才保留原标记。
  - 对正式卡选定的生产入口样本，接入前后规范化输出和关键状态快照必须零差异。

implementation_plan:
  - 最小修改 requirements.txt，在末尾新增 ./packages/docmind-domain-sdk，并保持 UTF-16LE BOM、CRLF 和其余内容不变。
  - 新增 app/domain_dispatch_port.py，定义同步 Protocol 和局部安全回落 helper。
  - 新增 app/domain_host/__init__.py 与 app/domain_host/host.py，仅实现 EmptyDomainHost。
  - 新增 bootstrap/domain_composition.py，仅提供 create_domain_host。
  - ask_notes.py::main 在 RepoState 完成后创建 Host，并以必填 keyword-only 参数传入 run_chat_loop。
  - app/chat_loop_parts/runner.py::run_chat_loop 接收 DomainDispatchPort，在确认进入 normal_retrieval 后执行一次影子 dispatch，再无条件沿原链路继续。
  - 新增根级 tracked pytest，覆盖端口、factory、注入、无插件回落与关键状态；不在被忽略的 tests/ 新增文件。
  - 不修改 app/chat_loop.py 的 *args/**kwargs 兼容转发，除非实施事实证明无法转发；若必须修改则触发停止条件，不自行扩围。

