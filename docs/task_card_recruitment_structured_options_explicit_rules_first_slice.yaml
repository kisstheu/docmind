problem_definition:
  missing_capability: >-
    程序调用方已经能把结构化 options 送达 RecruitmentJDPlugin.execute，但插件没有
    严格解析自身 namespace 并把七字段 wire 值转换为现有 JobSearchRules 的入口，
    因此现有比较服务尚未接入 production StaticDomainHost 程序调用链。
  rejected_paths:
    - 把求职规则或 options JSON 拼进 query
    - 在 SDK 中增加招聘 DTO、招聘字段或业务枚举
    - 在 Host 中解析招聘 namespace 或补求职规则默认值
    - 在 dispatch 增加招聘专用参数
    - 从 runner、CLI、WorkState、简历、环境变量或历史对话隐式加载规则
    - 新建中央 namespace registry 或 JSON Schema artifact
    - 复制或改写已有比较和渲染算法
  reason: >-
    这些路径会破坏 request-local 明示输入、领域插件所有权、query 保真和公共层中立性，
    并扩大首切片到尚未授权的规则来源、公共协议或业务算法。

architecture_decision:
  decision: GO
  decision_is_final: true
  selected_path: recruitment_plugin_internal_strict_options_adapter
  prerequisites_satisfied:
    - Domain SDK protocol 1.1 已提供 DomainRequest.options。
    - dispatch_domain_request 已提供可运行的 options 程序调用入口。
    - StaticDomainHost 已透明转发 options。
    - JobSearchRules 已提供稳定、不可变的七字段内部模型。
    - 三态比较和比较结果渲染已存在并通过回归。
  implementation_blocker_rule: >-
    若实现需要修改 packages/docmind-domain-sdk/**、app/domain_dispatch_port.py、
    app/domain_host/**、app/chat_loop_parts/runner.py 或 ask_notes.py，立即将实现任务标记为
    blocked；该需求不得在本卡授权下进入公共层。

first_slice_flow:
  input: 调用方通过 DomainRequest.options 提供本轮显式求职规则快照。
  parse: 招聘插件只定位并严格解析自身 PLUGIN_ID namespace。
  conversion: 七字段 JSON wire 值转换为现有 JobSearchRules。
  comparison: 调用现有 compare_job_search_rules。
  rendering: 调用现有 render_job_rule_comparison。
  forbidden_reimplementation:
    - JD 提取
    - 七字段比较算法
    - 三态判断
    - 比较结果渲染
    - 公共 options 传输
    - Host 业务路由

options_namespace:
  value: org.docmind.recruitment.jd-constraints
  source_of_truth: docmind_recruitment_plugin.plugin.PLUGIN_ID
  rules:
    - 顶层 namespace 必须逐字符等于稳定 PLUGIN_ID。
    - 不使用 Python package 名或 module 名作为 namespace。
    - 不增加中央 namespace registry。
    - options 可同时包含其他插件 namespace。
    - 招聘插件只读取自身 namespace。
    - 其他 namespace 不得改变招聘插件旧行为。
    - SDK 与 Host 不解析、过滤、改名或补全该 namespace。

payload_version:
  constant_name: OPTIONS_SCHEMA_VERSION
  value: "1.0"
  owner: recruitment_plugin
  distinctions:
    domain_protocol_1_1: DomainRequest 公共 wire 协议版本。
    plugin_manifest_schema_version: PluginManifest 当前 manifest schema_version 字段。
    recruitment_options_schema_1_0: 本 namespace 内显式规则 payload 的独立版本。
  rules:
    - namespace 一旦出现，schema_version 必填。
    - 首版只接受字符串 "1.0"。
    - 缺失、null、非字符串或不支持的版本均原子拒绝。
    - 不猜测版本，不降级为其他版本。
    - 不把 Domain protocol 1.1 当作业务 payload 版本。
    - 不修改 PluginManifest.schema_version 语义。

payload_wire_schema:
  canonical_example: |
    {
      "org.docmind.recruitment.jd-constraints": {
        "schema_version": "1.0",
        "explicit_rules": {
          "minimum_monthly_salary_k": 13,
          "require_double_weekends": true,
          "allow_outsourcing": false,
          "allow_onsite": false,
          "allowed_locations": ["示例城市甲"],
          "candidate_education_level": "associate",
          "candidate_relevant_years": 2
        }
      }
    }
  namespace_object:
    wire_type: object
    required_fields:
      - schema_version
      - explicit_rules
    allowed_fields:
      - schema_version
      - explicit_rules
    additional_fields: forbidden
    null: forbidden
    empty_object: forbidden
  explicit_rules:
    wire_type: object
    required: true
    allowed_fields:
      - minimum_monthly_salary_k
      - require_double_weekends
      - allow_outsourcing
      - allow_onsite
      - allowed_locations
      - candidate_education_level
      - candidate_relevant_years
    additional_fields: forbidden
    null: forbidden
    empty_object: allowed_no_op
  unknown_field_policy:
    namespace_level: reject_atomically
    explicit_rules_level: reject_atomically
    rationale: 调用方明确提供但插件不支持的规则不得被静默忽略。
  legal_no_op: |
    {
      "org.docmind.recruitment.jd-constraints": {
        "schema_version": "1.0",
        "explicit_rules": {}
      }
    }
  invalid_empty_namespace: |
    {
      "org.docmind.recruitment.jd-constraints": {}
    }
  invalid_null_namespace: |
    {
      "org.docmind.recruitment.jd-constraints": null
    }

seven_field_wire_contract:
  field_order:
    - minimum_monthly_salary_k
    - require_double_weekends
    - allow_outsourcing
    - allow_onsite
    - allowed_locations
    - candidate_education_level
    - candidate_relevant_years
  minimum_monthly_salary_k:
    wire_type: JSON number
    internal_type: Decimal
    unit: K/月
    validation:
      - type(value) 必须是 int 或 float，bool 明确拒绝。
      - 值必须有限且非负。
      - null 拒绝。
    conversion: Decimal(str(value))
    missing: 不比较薪资。
    direct_float_to_job_search_rules: forbidden
  require_double_weekends:
    wire_type: boolean
    internal_type: bool
    validation:
      - type(value) 必须是 bool。
      - null 拒绝。
    missing: 不比较工作制。
  allow_outsourcing:
    wire_type: boolean
    internal_type: bool
    validation:
      - type(value) 必须是 bool。
      - null 拒绝。
    missing: 不比较外包。
  allow_onsite:
    wire_type: boolean
    internal_type: bool
    validation:
      - type(value) 必须是 bool。
      - null 拒绝。
    missing: 不比较驻场。
  allowed_locations:
    wire_type: array[string]
    internal_type: tuple[str, ...]
    validation:
      - 输入必须是 JSON array。
      - 每个元素必须是 string。
      - 每个元素经 strip 检查后必须非空，存储值不由 adapter 改写。
      - null 拒绝。
    conversion: tuple(value)
    list_semantics: OR
    missing: 不比较地点。
    empty_array: 合法并归一为空 tuple，因此不比较地点。
    excluded_features:
      - 地点别名系统
      - 城市层级系统
      - 距离或通勤半径
      - 模糊地点匹配
  candidate_education_level:
    wire_type: string enum
    internal_type: EducationLevel
    accepted_values:
      - unrestricted
      - secondary
      - associate
      - bachelor
      - master
      - doctorate
    validation:
      - 只接受上述源码中真实存在的精确小写值。
      - null 拒绝。
    conversion: EducationLevel(value)
    missing: 不比较学历。
  candidate_relevant_years:
    wire_type: JSON number
    internal_type: Decimal
    unit: 年
    validation:
      - type(value) 必须是 int 或 float，bool 明确拒绝。
      - 值必须有限且非负。
      - null 拒绝。
    conversion: Decimal(str(value))
    missing: 不比较相关年限。
    direct_float_to_job_search_rules: forbidden
  missing_field_semantics:
    optional_rule_fields: true
    internal_unset:
      scalar_fields: None
      allowed_locations: []
    hidden_defaults: forbidden
  unsupported_rule_shapes:
    - 自由文本规则
    - 数组式规则清单
    - 条件组合对象
    - 模糊程度字段
  unsupported_rule_meanings:
    - Java
    - 模型调优
    - 机器学习
    - RAG
    - Agent
    - 技术栈偏好
    - 职位方向
    - 行业偏好
    - 单休是否可接受的复杂条件
    - 薪资与工作制的条件组合
    - “尽量”“最好”“优先”等模糊程度

adapter_contract:
  target_file: packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/request_options.py
  public_constants:
    OPTIONS_SCHEMA_VERSION: "1.0"
    INVALID_OPTIONS_CODE: recruitment.options.invalid_payload
    INVALID_OPTIONS_CATEGORY: invalid_request_options
  parse_entry:
    name: parse_recruitment_request_options
    conceptual_signature: >-
      parse_recruitment_request_options(options: Mapping[str, JsonValue])
      -> JobSearchRules | None
    return_semantics:
      namespace_absent: None
      namespace_present_with_empty_rules: JobSearchRules()
      namespace_present_with_nonempty_rules: 填入本轮显式值的 JobSearchRules
      namespace_present_invalid: 抛出 RecruitmentOptionsError
  error_type:
    name: RecruitmentOptionsError
    required_attributes:
      code: recruitment.options.invalid_payload
      category: invalid_request_options
    text_contract: str() 与 repr() 只包含固定 code/category，不包含输入 key、value 或 payload。
  responsibilities:
    - 只定位 PLUGIN_ID 对应 namespace。
    - 区分 namespace 缺失、合法空规则和 namespace 非法。
    - 校验 OPTIONS_SCHEMA_VERSION。
    - 严格校验 namespace object 和 explicit_rules object 字段集合。
    - 校验七字段的 JSON 类型、非负范围、有限性和学历枚举。
    - 明确拒绝 bool 冒充 JSON number。
    - 将数字转换为 Decimal(str(value))。
    - 将 location list 转换为 tuple。
    - 将 education string 转换为 EducationLevel。
    - 构造现有不可变 JobSearchRules。
    - 不修改调用方传入的 options 或任意嵌套容器。
    - 只产生固定、脱敏的内部错误 code/category。
  forbidden_dependencies_and_behavior:
    - 不实现 JD 识别、提取或比较。
    - 不读取 WorkState。
    - 不读取简历。
    - 不读取环境变量。
    - 不读取历史对话。
    - 不读取长期画像。
    - 不增加隐藏默认规则。
    - 不访问网络、数据库或文件系统。
    - 不修改 options。
    - 不在异常文本中包含完整 payload、字段名或规则值。

execute_wiring:
  target: RecruitmentJDPlugin.execute
  frozen_order:
    - step: 1
      behavior: 按现有逻辑对 request.query 识别并提取单份单岗位 JD。
    - step: 2
      behavior: 非 JD、跨域文本或多 JD 保持现有纯 abstain，不读取招聘 namespace。
    - step: 3
      behavior: 单 JD 提取成功后，调用 adapter 检查 PLUGIN_ID namespace。
    - step: 4
      behavior: namespace 不存在时调用现有 render_markdown，完整保持 JD 明示约束输出。
    - step: 5
      behavior: namespace 合法且 explicit_rules 为空时调用现有 render_markdown，完整保持 JD 明示约束输出。
    - step: 6
      behavior: >-
        namespace 合法且规则非空时，使用 adapter 返回的 JobSearchRules 调用现有
        compare_job_search_rules(extracted, rules)，再调用现有
        render_job_rule_comparison(comparison)，返回 handled。
    - step: 7
      behavior: >-
        namespace 存在但非法时原子拒绝，不调用比较服务，返回固定、脱敏、用户可见的
        handled 拒绝。
  invariants:
    - options 解析发生在 extract_constraints 成功之后。
    - 非 JD 文本不得因携带招聘 namespace 而被误判 handled。
    - 多 JD 输入不得进入单 JD 比较。
    - 不允许一部分规则生效、一部分规则被忽略。
    - options 不得进入 query、JD 原文、Markdown 证据或日志。
    - query 在插件执行前后逐字符不变。
    - 规则值不得写入 stdout、stderr 或日志。

invalid_payload_behavior:
  activation_conditions:
    - 现有 extract_constraints 已成功识别并提取单 JD。
    - 招聘插件自身 PLUGIN_ID namespace 存在。
    - namespace payload 校验失败。
  domain_result:
    status: handled
    answer_markdown: |-
      ## 求职规则输入无效

      本次未执行显式规则比较。请检查结构化求职规则后重试。
    focus_update: preserve
    evidence: []
    warnings: []
    error: null
  internal_error:
    code: recruitment.options.invalid_payload
    category: invalid_request_options
  rationale: >-
    StaticDomainHost 把非 handled 映射为 None；使用固定 handled 拒绝可阻止普通检索接管后
    静默忽略调用方显式提供的非法规则。
  security_rules:
    - Markdown 逐字符固定。
    - 不回显 option key。
    - 不回显 option value。
    - 不回显完整 payload。
    - 不回显薪资、地点、学历或年限值。
    - 不返回内部 Python 异常 repr。
    - 不执行任何部分比较。
    - 不调用 compare_job_search_rules。
    - 不调用 render_job_rule_comparison。
    - 不修改 query。
    - DomainResult 不新增 diagnostics 字段。
  abstain_precedence:
    - 非 JD 携带非法招聘 namespace仍保持纯 abstain。
    - 跨域文本携带非法招聘 namespace仍保持纯 abstain。
    - 多 JD 携带非法招聘 namespace仍保持纯 abstain。

no_options_compatibility:
  equivalent_inputs:
    - 完全省略 options。
    - options 等于空对象。
    - options 只包含其他插件 namespace。
    - 自身 namespace 合法且 explicit_rules 等于空对象。
  required_equivalence:
    domain_result: 完整 DomainResult 相等。
    markdown: 逐字符相等。
    status: 相等。
    sources: >-
      当前 DomainResult 通过 evidence 承载来源，完整结果相等冻结 evidence 与现状一致。
    diagnostics: >-
      当前 DomainResult 不存在 diagnostics 字段；本切片不得修改 SDK 或新增该字段，
      完整结果相等覆盖当前全部可观察字段。
    focus_update: 相等。
    evidence: 相等。
    warnings: 相等。
    error: 相等。
    handled_abstain_boundary: 相等。
    query: 逐字符相等。
  forbidden_side_effects:
    - 不加载默认求职规则。
    - 不读取长期画像。
    - 不读取 WorkState、简历或聊天历史。
    - 其他插件 namespace 不触发招聘解析或比较。
    - 合法空规则不进入比较渲染。
  preserved_existing_behavior:
    - 非 JD abstain。
    - 跨域文本 abstain。
    - 多 JD abstain。
    - probe 行为。
    - manifest 行为。
    - runner 无 options 路径。
    - 旧 JD 明示约束 Markdown。

three_state_comparison_reuse:
  required_calls:
    - compare_job_search_rules
    - render_job_rule_comparison
  algorithm_copy_or_fork: forbidden
  actual_statuses:
    MATCH:
      enum_value: match
      meaning: JD 明确信息满足调用方本轮显式规则。
    CONFLICT:
      enum_value: conflict
      meaning: JD 明确信息与调用方本轮显式规则明确冲突。
    UNKNOWN:
      enum_value: unknown
      meaning: JD 未写、表述含糊、范围跨阈值、原文冲突或信息不足。
  invariants:
    - JD 缺失对应信息时为 UNKNOWN。
    - JD 表述含糊时为 UNKNOWN。
    - JD 原文内部冲突时为 UNKNOWN。
    - 信息不足不能判为 CONFLICT。
    - 技术要求只保留为 JD 证据，不参与七字段 assessment。
    - 不新增评分、百分比、投递建议或自动淘汰结论。

responsibility_boundaries:
  caller:
    owns:
      - 明确知道本次目标是招聘插件。
      - 提供本轮显式规则快照。
      - 从未来长期画像中裁剪本轮所需七字段规则。
      - 通过 dispatch_domain_request(host, jd_text, options={...}) 发起程序调用。
    does_not_own:
      - 招聘 JD 提取或比较逻辑。
      - 把完整画像、简历或聊天历史放入 options。
      - 把规则或 options 拼入 query。
  sdk:
    continues_to_own:
      - 递归 JSON 类型。
      - 深拷贝与调用方输入隔离。
      - 有限数字。
      - 循环检测。
      - 编码字节、深度、总 key、总容器成员四项配额。
      - protocol wire 边界。
    forbidden_scope:
      - 招聘字段。
      - 招聘 DTO。
      - 招聘枚举。
      - 招聘 namespace registry。
  host:
    continues_to_own:
      - options 透明转发。
      - execute 前通用请求复验。
      - 通用结果边界校验。
    forbidden_scope:
      - 解释招聘 namespace。
      - 补业务默认值。
      - 记录完整 options 或单个规则值。
      - 修改 query。
  recruitment_plugin:
    owns:
      - 自身 PLUGIN_ID namespace。
      - OPTIONS_SCHEMA_VERSION。
      - namespace 对象与 explicit_rules 字段严格校验。
      - 七字段业务类型、范围、枚举和转换。
      - 构造 JobSearchRules。
      - 调用现有比较与渲染。
      - 非法 payload 的固定脱敏 handled 拒绝。

minimum_caller_boundary:
  required_reachability: production_static_host_programmatic_call
  canonical_call: |
    from app.domain_dispatch_port import dispatch_domain_request
    from ask_notes import create_production_domain_host
    from docmind_recruitment_plugin import PLUGIN_ID

    host = create_production_domain_host()

    result = dispatch_domain_request(
        host,
        jd_text,
        options={
            PLUGIN_ID: {
                "schema_version": "1.0",
                "explicit_rules": {
                    "minimum_monthly_salary_k": 13,
                    "require_double_weekends": True,
                    "allow_outsourcing": False,
                },
            },
        },
    )
  assertions:
    - 路径使用 ask_notes.create_production_domain_host 创建的真实 production StaticDomainHost。
    - 路径经过 dispatch_domain_request、StaticDomainHost 和 RecruitmentJDPlugin.execute。
    - 能力不能只在 adapter 或插件单元测试中可达。
    - runner 与 CLI 仍不提供规则来源。
    - 不增加 app service、caller provider 或隐藏全局状态。
    - 不修改 ask_notes.py，只复用现有 production host factory。
    - 不宣称 CLI 已支持显式规则比较。

first_slice_scope:
  plugin_runtime:
    - 定义 OPTIONS_SCHEMA_VERSION 等于 "1.0"。
    - 使用稳定 PLUGIN_ID 作为唯一招聘 namespace。
    - 新增严格、纯函数式 request_options adapter。
    - 完成七字段 JSON 到 JobSearchRules 的类型转换。
    - 在 RecruitmentJDPlugin.execute 中按冻结顺序接线。
    - 复用 compare_job_search_rules 与 render_job_rule_comparison。
    - 对已提取单 JD 的非法自身 namespace 返回固定 handled 拒绝。
    - 完整保持无 options 与合法空规则的旧结果。
  documentation:
    - 新增招聘插件 README，记录 namespace、payload version、七字段、错误边界与程序调用示例。
    - README 不宣称 runner、CLI、长期画像或 MCP 已接入。
  tests:
    - adapter 单元测试。
    - RecruitmentJDPlugin.execute 契约测试。
    - production StaticDomainHost + dispatch + options 全链测试。
    - 脱敏、输入不变与不部分成功测试。
    - 现有插件测试和 domain public 回归。

non_goals:
  - runner 修改
  - CLI JSON 参数
  - UI
  - MCP
  - 长期画像存储
  - WorkState 读取
  - 自动读取用户个人资料
  - 完整简历进入 options
  - 聊天历史进入 options
  - caller provider
  - app service
  - 隐藏全局状态
  - 中央 schema registry
  - JSON Schema artifact
  - capability negotiation
  - 动态插件发现
  - 多插件仲裁
  - 新的公共 SDK 或 Host 错误传播协议
  - Java 规则
  - 模型调优规则
  - 机器学习规则
  - RAG 或 Agent 技术方向规则
  - 技术栈、职位方向或行业偏好规则
  - 新求职规则字段
  - 多 JD 比较
  - 匹配百分比
  - 自动投递建议
  - 自动淘汰
  - 部分成功策略
  - 地点别名、城市层级、距离、通勤半径或模糊地点匹配
  - 条件组合、自由文本规则或模糊程度规则

expected_modified_files:
  plugin_runtime:
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/plugin.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/request_options.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/__init__.py
  plugin_documentation:
    - path: packages/docmind-recruitment-plugin/README.md
      change: add
      reason: 当前路径不存在；新增插件业务契约、程序调用示例和边界说明。
  plugin_tests:
    - packages/docmind-recruitment-plugin/tests/test_request_options.py
    - packages/docmind-recruitment-plugin/tests/test_plugin_contract.py
  production_contract_tests:
    - public_tests/domain/test_recruitment_jd_production_wiring_contract.py
  exact_list: true
  expansion_rule: >-
    实现若证明必须增加其他招聘插件内部文件或测试文件，先更新并重新定稿任务卡，写明
    不可替代原因；不得在原授权下扩大到公共 SDK、Host、dispatch、runner 或 CLI。

protected_files_and_paths:
  comparison_implementation:
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_contracts.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_rendering.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_compensation.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_work_arrangement.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_qualifications.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_support.py
  extraction_and_recognition:
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/recognition.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/extraction.py
    - packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/rendering.py
  existing_comparison_tests:
    - packages/docmind-recruitment-plugin/tests/test_rule_comparison.py
  package_metadata:
    - packages/docmind-recruitment-plugin/pyproject.toml
  public_layers:
    - packages/docmind-domain-sdk/**
    - app/domain_dispatch_port.py
    - app/domain_host/**
    - app/chat_loop_parts/runner.py
    - ask_notes.py
    - bootstrap/**
  unrelated_paths:
