task_background:
  - >-
    Domain SDK protocol 1.1 已交付 DomainRequest.options 的 request-local 递归 JSON
    契约、输入隔离、有限数字校验、循环检测和四项固定配额。
  - >-
    dispatch_domain_request 已接受 keyword-only options，StaticDomainHost 在 execute
    前执行通用复验并把同一个 DomainRequest 透明交给招聘插件。
  - >-
    招聘插件已拥有不可变七字段 JobSearchRules、MATCH/CONFLICT/UNKNOWN 三态比较、
    compare_job_search_rules 和 render_job_rule_comparison，但生产 execute 尚未消费
    request.options。
  - >-
    当前缺口限定为招聘插件内部严格 payload adapter 和 execute 接线；公共 SDK、Host、
    dispatch、runner 与 CLI 均已处于本切片所需边界之外。

current_evidence:
  sdk_domain_request:
    path: packages/docmind-domain-sdk/src/docmind_domain_sdk/dto.py
    symbols:
      - DomainRequest
      - DomainResult
      - PluginManifest
      - PluginError
    facts:
      - DomainRequest.options 的运行时存储是 dict[str, JsonValue]，默认值为空对象。
      - WireModel 使用 extra=forbid、frozen=True、allow_inf_nan=False 和 hide_input_in_errors=True。
      - >-
        DomainResult 当前字段为 protocol_version、request_id、plugin_id、status、
        answer_markdown、focus_update、evidence、warnings 和 error，不存在 diagnostics 字段。
      - handled 结果必须有非空 answer_markdown 且 error 必须为 None。
      - PluginManifest.schema_version 是 manifest 字段，不是本任务的 options payload 版本。
  sdk_validation:
    path: packages/docmind-domain-sdk/src/docmind_domain_sdk/validation.py
    facts:
      - SDK 只验证递归 JSON 类型、有限数字、循环引用和四项固定配额。
      - SDK 不理解招聘 namespace、字段、枚举、单位或业务组合。
  sdk_protocol:
    path: packages/docmind-domain-sdk/src/docmind_domain_sdk/protocol.py
