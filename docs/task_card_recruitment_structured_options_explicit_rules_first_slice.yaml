test_matrix:
  payload_parser:
    - id: parser-namespace-absent
      scenario: 自身 namespace 缺失时返回 None。
    - id: parser-valid-empty-rules
      scenario: 合法空 explicit_rules 返回 JobSearchRules()。
    - id: parser-valid-seven-fields
      scenario: 合法七字段 payload 全部转换成功。
    - id: parser-null-namespace
      scenario: 自身 namespace 为 null 时固定错误。
    - id: parser-non-object-namespace
      scenario: 自身 namespace 为 string、number、boolean 或 array 时固定错误。
    - id: parser-empty-namespace
      scenario: 自身 namespace 为空 object 时因缺少两个必填字段固定错误。
    - id: parser-missing-version
      scenario: schema_version 缺失时固定错误。
    - id: parser-version-type
      scenario: schema_version 为 null、number、boolean、array 或 object 时固定错误。
    - id: parser-unsupported-version
      scenario: schema_version 不是精确字符串 "1.0" 时固定错误。
    - id: parser-namespace-unknown-field
      scenario: namespace object 出现第三个字段时原子拒绝。
    - id: parser-rules-unknown-field
      scenario: explicit_rules 出现七字段之外字段时原子拒绝。
    - id: parser-missing-rules
      scenario: explicit_rules 缺失时固定错误。
    - id: parser-rules-type
      scenario: explicit_rules 为 null、string、number、boolean 或 array 时固定错误。
    - id: parser-seven-field-types
      scenario: 七字段逐一覆盖错误 JSON 类型。
    - id: parser-bool-is-not-number
      scenario: 两个 number 字段分别拒绝 true 和 false。
    - id: parser-negative-salary
      scenario: 负薪资固定错误。
    - id: parser-negative-years
      scenario: 负相关年限固定错误。
    - id: parser-nonfinite
      scenario: 通过隔离的 adapter 单测覆盖 NaN、Infinity 和负 Infinity 拒绝。
    - id: parser-education-enum
      scenario: 非六个真实 EducationLevel 值固定错误。
    - id: parser-location-item-type
      scenario: location array 中非 string 元素固定错误。
    - id: parser-location-empty-string
      scenario: location array 中空字符串或纯空白字符串固定错误。
    - id: parser-null-rule-fields
      scenario: 七字段逐一显式传 null 均固定错误。
    - id: parser-free-text-and-array-shapes
      scenario: 自由文本、规则数组和条件组合形态固定错误。
    - id: parser-input-unchanged
      scenario: 成功与失败后原始 mapping 和任意嵌套值均未修改。
    - id: parser-output-frozen
      scenario: 输出 JobSearchRules 继续不可变。
    - id: parser-other-namespaces
      scenario: 自身 namespace 与三个异质插件 namespace 共存且只解析自身值。
    - id: parser-redacted-errors
      scenario: 异常属性、str 和 repr 不包含未知 key、规则值或完整 payload。
  seven_field_mapping:
    - id: mapping-salary-number
      scenario: int 与有限 float 均通过 Decimal(str(value)) 写入 minimum_monthly_salary_k。
    - id: mapping-double-weekends
      scenario: boolean 逐值写入 require_double_weekends。
    - id: mapping-outsourcing
      scenario: boolean 逐值写入 allow_outsourcing。
    - id: mapping-onsite
      scenario: boolean 逐值写入 allow_onsite。
    - id: mapping-locations
      scenario: location list 按顺序转为 tuple，重复值不由 adapter 删除。
    - id: mapping-empty-locations
      scenario: 空 location list 转为空 tuple 并保持不比较地点。
    - id: mapping-education
      scenario: 六个 wire string 分别转为对应 EducationLevel 成员。
    - id: mapping-years-number
      scenario: int 与有限 float 均通过 Decimal(str(value)) 写入 candidate_relevant_years。
    - id: mapping-missing-fields
      scenario: 缺失 scalar 字段保持 None，缺失 location 保持空 tuple。
  plugin_execute:
    - id: execute-no-options
      scenario: 省略 options 与冻结的旧 DomainResult 和 Markdown 逐字符相等。
    - id: execute-empty-options
      scenario: options 为空对象与冻结的旧 DomainResult 逐字段相等。
    - id: execute-other-namespace
      scenario: 只有其他 namespace 时与冻结的旧 DomainResult 逐字段相等。
    - id: execute-valid-empty-rules
      scenario: 合法空 rules 与冻结的旧 DomainResult 逐字段相等且不调用比较渲染。
    - id: execute-single-field
      scenario: 合法单字段规则只产生对应字段 assessment。
    - id: execute-each-field
      scenario: 七字段分别单独生效并保持现有字段顺序。
    - id: execute-combined-rules
      scenario: 多规则组合一次构造 JobSearchRules 并一次调用现有比较与渲染。
    - id: execute-match
      scenario: JD 明确信息满足规则时进入明确符合。
    - id: execute-conflict
      scenario: JD 明确信息明确冲突时进入明确冲突。
    - id: execute-missing
      scenario: JD 信息缺失时进入 UNKNOWN，不判冲突。
    - id: execute-ambiguous
      scenario: JD 表述含糊时进入 UNKNOWN，不判冲突。
    - id: execute-source-conflict
      scenario: JD 原文冲突时进入 UNKNOWN，不判冲突。
    - id: execute-invalid-own-namespace
      scenario: 单 JD 加非法自身 namespace 返回逐字符固定 handled 拒绝。
    - id: execute-invalid-no-compare
      scenario: 非法 payload 时 compare_job_search_rules 和 render_job_rule_comparison 调用次数均为零。
    - id: execute-atomic-rejection
      scenario: 一个合法字段与一个非法字段共存时无 assessment、无比较 Markdown、无部分成功。
    - id: execute-non-jd-invalid-options
      scenario: 非 JD 加非法自身 namespace 仍返回现有纯 abstain。
    - id: execute-cross-domain-invalid-options
      scenario: 合同与采购异质样本加非法自身 namespace 仍返回现有纯 abstain。
    - id: execute-multi-jd-invalid-options
      scenario: 多 JD 加非法自身 namespace 仍返回现有纯 abstain。
    - id: execute-query-preserved
      scenario: 成功、no-op、拒绝和 abstain 路径的 request.query 均逐字符不变。
    - id: execute-options-not-rendered
      scenario: options JSON、namespace、字段名与规则哨兵值不进入 JD 原文或 Markdown。
    - id: execute-probe-manifest-regression
      scenario: probe、manifest、lifecycle 与 sync 行为保持现状。
  production_full_chain:
    - id: production-real-factory
      scenario: 使用 ask_notes.create_production_domain_host 创建真实 StaticDomainHost。
    - id: production-dispatch-options
      scenario: dispatch_domain_request 传入合法招聘 namespace 后产生现有比较 Markdown。
    - id: production-host-forwarding
      scenario: 路径经过真实 RecruitmentJDPlugin 和 StaticDomainHost，options 值等价传递。
    - id: production-query-preserved
      scenario: production 全链中 query 逐字符等于 jd_text。
    - id: production-no-options
      scenario: 省略 options 的 production 原路径结果逐字段不变。
    - id: production-invalid-payload
      scenario: 非法 payload 通过 dispatch 返回逐字符固定 handled 拒绝，不回落 None。
    - id: production-other-namespace
      scenario: 仅其他 namespace 不改变 production 旧结果。
    - id: production-public-layer-unchanged
      scenario: 实现提交对 SDK、Host、dispatch、runner、CLI 与 ask_notes.py 均无 diff。
  privacy_and_errors:
    - id: privacy-fixed-code-category
      scenario: adapter 错误 code 与 category 逐字符等于冻结值。
    - id: privacy-exception-text
      scenario: str 与 repr 只暴露固定 code/category。
    - id: privacy-domain-result
      scenario: handled 拒绝只包含固定 Markdown，evidence/warnings 为空且 error 为 None。
    - id: privacy-no-diagnostics
      scenario: 当前 DomainResult 不新增 diagnostics，拒绝路径不通过新字段传值。
    - id: privacy-stdout-stderr
      scenario: stdout 与 stderr 不包含 payload、未知 key 或规则值。
    - id: privacy-sentinels
      scenario: 合成薪资、地点、学历和年限哨兵值均不出现在错误、输出或日志。
    - id: privacy-no-python-repr
      scenario: 用户输出不包含异常类名、Python repr 或完整 options。
  regression:
    - id: regression-plugin-all
      scenario: packages/docmind-recruitment-plugin/tests 全部通过。
    - id: regression-domain-public
      scenario: public_tests/domain 全部通过。
    - id: regression-full-pytest
      scenario: 仓库全量 pytest 通过且 warning 不过滤。
    - id: regression-manifest-probe
      scenario: manifest、probe、旧 JD 明示字段输出和旧 abstain 边界保持不变。
    - id: regression-comparison
      scenario: 现有七字段比较算法与三态语义保持不变。
    - id: regression-protocol
      scenario: protocol 1.0 历史 artifact 与 protocol 1.1 公共能力无修改。
  generalized_rule_guard:
    rationale: >-
      本切片规则来自已交付七字段 JobSearchRules 和失败边界，不按岗位、行业、公司或地域
      做路由；namespace 解析只在现有单 JD 提取成功后执行。
    hit_sample: 单 JD 加合法自身 namespace 执行七字段比较。
    adjacent_non_trigger: 非 JD 招聘宣传加非法自身 namespace 仍 abstain。
    cross_domain_counterexamples:
      - 合同文本加非法自身 namespace 仍 abstain。
      - 采购文本加非法自身 namespace 仍 abstain。
      - 项目需求文本加非法自身 namespace 仍 abstain。

quality_gate:
  environment:
    - 使用 Linux Bash。
    - Python 使用 .venv/bin/python。
    - 设置 PYTHONDONTWRITEBYTECODE=1。
    - 测试显式设置仓库 SDK 与招聘插件 src 的 PYTHONPATH。
    - pytest 关闭 cache provider，warning 不过滤。
  verification_order:
    - UTF-8 可解码与乱码扫描。
    - 修改 Python 文件 py_compile。
    - adapter 和 plugin 函数级测试。
    - production StaticHost + dispatch 最小全链。
    - 插件测试与 domain public 回归。
    - 仓库全量 pytest。
  commands:
    task_card_yaml: >-
      .venv/bin/python -c
      "from pathlib import Path; import yaml;
      p=Path('docs/task_card_recruitment_structured_options_explicit_rules_first_slice.yaml');
      data=yaml.safe_load(p.read_text(encoding='utf-8'));
      assert isinstance(data, dict); print('YAML_OK')"
    implementation_py_compile: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m py_compile
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/plugin.py
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/request_options.py
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/__init__.py
      packages/docmind-recruitment-plugin/tests/test_request_options.py
      packages/docmind-recruitment-plugin/tests/test_plugin_contract.py
      public_tests/domain/test_recruitment_jd_production_wiring_contract.py
    adapter_tests: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
      packages/docmind-recruitment-plugin/tests/test_request_options.py
    plugin_contract_tests: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
      packages/docmind-recruitment-plugin/tests/test_plugin_contract.py
    production_chain_tests: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
      public_tests/domain/test_recruitment_jd_production_wiring_contract.py
    plugin_tests: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
      packages/docmind-recruitment-plugin/tests
    domain_public: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
      public_tests/domain
    full_pytest: >-
      PYTHONDONTWRITEBYTECODE=1
      PYTHONPATH=packages/docmind-domain-sdk/src:packages/docmind-recruitment-plugin/src
      .venv/bin/python -m pytest -q -p no:cacheprovider
    text_encoding: >-
      .venv/bin/python -c
      "from pathlib import Path;
      paths=[*Path('packages/docmind-recruitment-plugin').rglob('*.py'),
      *Path('packages/docmind-recruitment-plugin').rglob('*.md'),
      *Path('public_tests/domain').rglob('*.py')];
      texts=[p.read_text(encoding='utf-8') for p in paths];
      assert all(chr(0xfffd) not in text for text in texts)"
    public_layer_no_diff: >-
      test -z "$(git diff --name-only --
      packages/docmind-domain-sdk app/domain_dispatch_port.py app/domain_host
      app/chat_loop_parts/runner.py ask_notes.py bootstrap)"
    protected_comparison_no_diff: >-
      test -z "$(git diff --name-only --
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison.py
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_contracts.py
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_rendering.py
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_compensation.py
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_work_arrangement.py
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_qualifications.py
      packages/docmind-recruitment-plugin/src/docmind_recruitment_plugin/comparison_support.py
      packages/docmind-recruitment-plugin/tests/test_rule_comparison.py)"
    diff_check: git diff --check
  required_results:
    - adapter、plugin execute 和 production 全链测试通过。
    - 无 options 与四种 no-op 输入的完整 DomainResult 和 Markdown 精确兼容。
    - 命中、相邻误触发和三类跨域反例均通过。
    - 插件测试、domain public 和仓库全量 pytest 通过。
    - 乱码扫描与 git diff --check 通过。
    - SDK、Host、dispatch、runner、CLI、ask_notes.py 和比较实现无 diff。
    - 最终实现提交后工作区干净且未 push。

privacy_guard:
  - 测试、README 和示例只使用某公司A、候选人X、示例城市甲与合成数值。
  - 不在测试断言、异常、stdout、stderr、Markdown 或日志中保留真实个人或企业信息。
  - 固定拒绝不包含字段名、规则值、完整 payload 或内部异常 repr。
  - 规则值只在内存中转换为 JobSearchRules，不写入持久化状态。

acceptance_min:
  - 招聘插件只消费自身 PLUGIN_ID namespace。
  - payload version 独立于 Domain protocol 和 PluginManifest schema_version，且严格只接受 "1.0"。
  - 七字段全部按冻结 wire 契约映射到现有 JobSearchRules。
  - 现有比较算法与比较渲染只复用，不复制、不改写、不分叉。
  - 无 options、空 options、其他 namespace 与合法空规则的完整旧结果精确不变。
  - 非 JD、跨域文本与多 JD 的 abstain 边界精确不变。
  - 非法 payload 原子拒绝且不执行部分比较。
  - 非法 payload 返回固定用户可见 handled Markdown，错误 code/category 与输出完全脱敏。
  - production StaticHost + dispatch + options 程序调用链通过。
  - SDK、Host、dispatch、runner、CLI 与 ask_notes.py 无修改。
  - 不新增技术方向规则或七字段之外求职规则。
  - 插件测试、domain public 和全量 pytest 全部通过。
  - 实现工作区最终干净并创建独立本地实现提交。
  - 未 push，除非后续获得单独授权。

completion_line:
  implementation_complete_when:
    - expected_modified_files 的 runtime、README 与测试全部交付。
    - protected_files_and_paths 无差异。
    - test_matrix 的全部自动场景通过。
    - quality_gate.required_results 全部满足。
    - acceptance_min 全部满足。
    - 实现提交后 main 工作区干净、暂存区为空且未 push。
  incomplete_if:
    - options 被拼入 query。
    - 空 options 自动加载默认画像或长期状态。
    - 其他插件 namespace 导致行为变化。
    - 合法空 rules 进入比较渲染并改变旧输出。
    - 未知 namespace 字段或未知规则字段被静默忽略。
    - 非法规则出现部分生效。
    - 错误回显规则值、字段名、完整 payload 或 Python repr。
    - 非 JD、跨域文本或多 JD 因非法招聘 payload 被 handled。
    - 多 JD 进入单 JD 比较。
    - 复制、改写或分叉现有比较算法或比较渲染。
    - 修改公共 SDK、Host、dispatch、runner、CLI 或 ask_notes.py。
    - 新增 Java、模型调优、机器学习、RAG、Agent 或其他技术方向规则字段。
    - 只在 adapter 或插件单测可达，未经过 production StaticHost + dispatch。
    - 未冻结并验证逐字符旧 Markdown 与完整 DomainResult。
    - 插件测试、domain public 或全量 pytest 未通过。

follow_up_slices:
  record_only: true
  implementation_in_first_slice: forbidden
  items:
    - runner 或其他调用方的显式规则来源设计
    - CLI、UI 或 API 的结构化规则输入
    - 长期求职画像存储、授权、裁剪与删除
    - 新求职规则字段及对应比较语义
    - 技术方向、技术栈与模糊规则系统
    - 多 JD 比较与调用方决策支持
    - manifest options capability 声明与协商
    - 动态多插件发现、仲裁与 namespace 定向
    - MCP transport 映射
    - JSON Schema artifact 或中央 schema registry 再评估

