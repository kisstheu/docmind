  deny:
    - docs/task_card_repo_meta_generic_file_list_scope.yaml
    - docs/task_card_result_set_detail_followup_generation_fallback.yaml
    - retrieval/**
    - packages/docmind-domain-sdk/**
    - packages/docmind-recruitment-plugin/**
    - examples/**
    - tests/**
    - test_notes/**

non_goals:
  - 修改 embedding、召回评分、文件排序和索引逻辑
  - 修改远程 Prompt 系统
  - 回滚单文件展开生成回退修复
  - 大规模 ConversationState 重构
  - 把上一轮模型回答当事实证据
  - 让所有后续问题永久继承旧结果集
  - 通过硬编码具体文件名、岗位名称或完整测试问句通过验收
  - 修改真实文件改名能力的业务语义
  - 增加与本任务无关的功能

privacy_guard:
  - 测试只使用合成文件名、合成文本和离线替身。
  - 不写入真实公司名、人名、联系方式或用户知识库内容。
  - 不依赖本地私有资料或绝对路径样本。

test_matrix:
  focus_continuation:
    - 当前知识库有哪些文件？
    - 这些文件分别讲了什么？
    - 第二个文件再详细说说。
    - 这个岗位对学历、开发年限和AI项目经验分别有什么要求？
  content_followup:
    - 这些要求里，哪些是硬门槛，哪些更像优先项？
  focus_switch:
    - 第五个文件也详细说说。
    - 它和第二个文件相比，哪个更偏客户项目交付？
  ordinal_selection:
    - 那第十四个文件呢？它最看重什么？
    - 第二十个文件再详细说说。
  ordinal_correction:
    - 第二十个文件再详细说说。
    - 那就改成第十个文件。
  rename_regression:
    - 把“旧名称.txt”改成“新名称.txt”
  independence:
    - Python里的生成器和普通函数有什么区别？
  non_regression:
    - 原文件列表、集合综合回答和序号选择保持既有行为。
    - 单文件展开生成回退修复不退化。
    - 普通集合归纳不会错误收缩到当前单项。

verification:
  task_card:
    - UTF-8 可解码且无 BOM
    - yaml.safe_load 可解析
    - 递归检查无重复键
    - 不含真实身份信息、真实知识库内容或用户绝对路径
  targeted:
    - >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      public_tests/state/test_repo_meta_generic_file_list_scope_contract.py
  public:
    - >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider public_tests
  full:
    - >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      tests packages/docmind-domain-sdk/tests packages/docmind-recruitment-plugin/tests
      public_tests test_query_router_repo_meta.py
  static:
    - git diff --check
    - git diff --cached --check
    - rg -n "result_set_focus_file|第十四个文件|第二十个文件|改成第十个文件" app public_tests docs -S
  cli:
    - 使用合成索引与离线模型替身运行真实 CLI 多轮复现

  acceptance:
  - 单项展开后，“这个岗位”仍限定当前文件。
  - “这些要求”继续使用当前文件证据。
  - 第二项切换到第五项后，原集合仍保留。
  - 当前焦点正确更新为第五项。
  - “它和第二个文件相比”只允许两个文件。
  - 后续仍可选择第十四项。
  - '"第十四个文件 + 最看重什么" 可被识别。'
  - 第二十项本地越界，不检索、不生成。
  - 越界后的“改成第十个文件”按序号纠正。
  - 真实改名仍进入 rename。
  - 独立新问题退出旧上下文。
  - 普通集合归纳不会错误缩到当前单项。
  - 没有当前焦点时，“这个岗位”不会随意猜测。
  - 当前焦点清理后不会复活。
  - 原单文件展开生成回退契约不退化。
  - 原文件列表、集合综合回答和序号选择契约不退化。
  - 新增测试位于 tracked public_tests 或有明确理由的新 tracked 公共测试文件。
  - 完整回归通过，且最终不 push。

completion_record_requirements:
  - 记录任务卡路径、核心边界和根因。
  - 记录红测、定向测试、公共测试与全量回归结果。
  - 记录真实 CLI 的关键日志与范围结论。
  - 记录 YAML、编码、重复键、隐私和路径扫描结果。
  - 记录实际修改文件和未触碰的非目标。
  - 记录两个本地 commit hash、message 和 git show --stat。
  - 记录最终 git status --short --branch。
  - 明确未 push。
