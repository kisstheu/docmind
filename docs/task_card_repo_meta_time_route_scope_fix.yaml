version: 1

task_name: repo_meta_time_route_scope_fix

task_goal: >-
  收窄 Core 的 repo-meta 文件时间路由边界：普通业务正文中的时间、周期和期限问题
  不得再仅凭宽泛时间词被文件元数据查询抢占；真实的文件或笔记创建、修改、更新、
  新增、删除、重命名、版本、最新、最早、明确日期/范围与排序查询必须保持可用；
  已有 repo-meta 文件结果集下的排序短追问必须按上下文正确路由。实现采用
  领域无关的正向意图合取，不加入汽车、合同、课程或其他业务领域黑名单。

task_kind: independent_core_routing_bugfix
implementation_status: ready_for_implementation_after_preflight

authorization_statement: >-
  本任务卡提交并获用户采用后，后续实施者可在 preflight 全部通过的前提下，
  仅修改 editable_scope.default_allow 与满足启用条件后的 conditional_allow。
  不需要以 after_fix 已通过作为开始修改代码的前置条件；after_fix 是实现完成后的
  验收记录。任何未列明路径都不因“实现必要”获得隐式授权。

communication_preference:
  tone: professional
  language: zh-CN
  report_order:
    - 结论
    - 变更
    - 验证
    - 风险

background:
  audited_commit: d4edf08685c98dfcb25b15d0f51c7b1718315354
  audited_branch: arch/domain-plugin-spike
  audit_root: test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/regression_q1_time_route/before_fix
  audit_records:
    - test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/regression_q1_time_route/before_fix/audit_summary.md
    - test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/regression_q1_time_route/before_fix/root_cause_audit.md
    - test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/regression_q1_time_route/before_fix/route_evidence.md
    - test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/regression_q1_time_route/before_fix/control_route_evidence.md
    - test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/regression_q1_time_route/before_fix/corpus_and_index.md
    - test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/regression_q1_time_route/before_fix/repository_state.md
  audit_records_policy: >-
    上述目录仅可读取；不得修改、覆盖、删除或把其中内容作为 tracked 交付。
  defect_type: Core 通用路由语义边界缺陷
  not_owned_by:
    - 招聘 JD 插件
    - Domain SDK
    - StaticDomainHost
    - handled result 消费
    - 汽车维修领域开发
    - 日期解析能力扩展
    - 文件变更历史功能增强

verified_baseline:
  original_failure:
    question: "定期保养在什么时间或里程条件下进行？特殊使用条件会带来什么变化？"
    current_route: repo_meta/time
    expected_route: normal_retrieval
    observed_effects:
      - 未进入 normal retrieval
      - 检索候选为 0
      - 未调用 Gemini
      - 返回最新和最早文件列表
  confirmed_call_chain:
    - ask_notes.py::main
    - app/chat_loop_parts/runner.py::run_chat_loop
    - app/file_actions/loop.py::handle_file_action_turn
    - app/dialog/state_machine.py::detect_dialog_event
    - app/dialog/repo_meta_rules.py::looks_like_repo_time_question
    - app/retrieval_flow/routing.py::resolve_route
    - ai/repo_meta/classifier.py::classify_repo_meta_question
    - ai/repo_meta/classifier_predicates.py::looks_like_time_request
    - ai/repo_meta/answering_parts/time.py::_answer_time
  confirmed_root_cause: >-
    app/dialog/repo_meta_rules.py 中 has_explicit_time_axis 与 has_time_signal
    使用重叠的宽泛时间词；has_explicit_time_axis and has_time_signal
    无需文件对象、文件元数据动作或 repo-meta 上下文即可为真。进入 repo-meta 后，
    classifier 的 looks_like_time_request 与通用 TIME_KEYWORDS 再次宽判为 time。
  other_confirmed_false_positives:
    - question: "合同在什么时间到期？"
      current_route: repo_meta/time
      expected_route: normal_retrieval
    - question: "课程每隔多长时间安排一次？"
      current_route: repo_meta/time
      expected_route: normal_retrieval
  current_correct_content_routes:
    - question: "电池一般多久检查一次？"
      expected_and_current_route: normal_retrieval
    - question: "这个项目计划什么时候完成？"
      expected_and_current_route: normal_retrieval
    - question: "这份合同文档什么时候到期？"
      expected_and_current_route: normal_retrieval
      boundary_reason: >-
        同时包含“文档”和“什么时候”仍不足以证明文件元数据意图；
        该问题询问文档正文中的合同期限。
  confirmed_positive_gap:
    question: "找出六月以后新增的笔记。"
    current_route: normal_retrieval
    expected_route: repo_meta_file_time
    scope_note: >-
      本任务只修复路由归属，不扩展“六月以后”的实际日期范围解析或回答过滤。
  contextual_short_followup_gap:
    question: "最近的呢？"
    context: 上一轮已经形成 repo-meta 文件结果集
    current_state_machine: unknown/None
    current_classifier: time
    expected_after:
      state_machine: repo_meta route hint
      classifier: time
      route: repo_meta/time
    boundary: 只有已有 repo-meta 文件结果集上下文时成立
  fresh_state_short_followup_boundary:
    question: "最近的呢？"
    context: fresh state，没有 repo-meta 文件结果集
    current_state_machine: unknown/None
    current_classifier: time
    expected_after:
      state_machine: 不产生 repo-meta route hint
      classifier: 不得认定为文件元数据 time
      route: 普通对话或 normal retrieval 边界
    boundary: “最近”不能在无文件上下文时独立触发文件时间路由
  classifier_fallback_evidence:
    question: "最近合同到期吗？"
    looks_like_time_request: false
    classify_repo_meta_question: time
    conclusion: >-
      classifier 的通用 TIME_KEYWORDS/RULES 可绕过 predicate，继续产生 time；
      后续 tracked 红测稳定复现后，具备启用条件性 classifier 文件的审计依据。

scope_resolution:
  decision: >-
    将文件元数据时间意图定义为领域无关的正向合取，而不是正文业务词反证黑名单。
    状态机入口与 classifier 必须表达一致语义，且不得改变 runner 的处理顺序。
  target_semantics:
    conjunction:
      file_or_note_scope:
        examples:
          - 文件
          - 文档
          - 笔记
          - 资料
          - 目录
          - 明确文件扩展名
          - 已有文件结果集上下文
      file_metadata_action_or_order:
        examples:
          - 创建
          - 修改
          - 更新
          - 新增
          - 删除
          - 重命名
          - 版本
          - 最新
          - 最早
          - 最近文件
      query_shape:
        examples:
          - 询问文件元数据时间
          - 明确日期或日期范围
          - 列表
          - 筛选
          - 排序
    route_rule: >-
      文件或笔记范围 + 文件元数据动作或排序语义 + 时间查询、日期范围、
      列表或排序形状，才进入 repo-meta 文件时间路由。现有“明确日期 + 文件列表”
      契约和 repo-meta 文件结果集上下文短追问可作为受控上下文变体保留。
    insufficient_signals:
      - 时间
      - 日期
      - 多久
      - 周期
      - 到期
      - 什么时候
    prohibited_implementation_forms:
      - 保养黑名单
      - 里程黑名单
      - 合同黑名单
      - 课程黑名单
      - 其他不断累加的业务领域词表
      - 由 LLM 判断 repo-meta 时间意图
      - 用 Prompt 或模型参数弥补确定性路由缺陷
  consistency_requirement: >-
    detect_dialog_event 的时间 guard 与 classify_repo_meta_question 的 time topic
    必须共享等价语义。不得出现状态机判为正文、classifier 又仅凭“时间”判为 time，
    或反向不一致。

editable_scope:
  default_allow:
    production:
      - app/dialog/repo_meta_rules.py
      - ai/repo_meta/classifier_predicates.py
    tracked_tests:
      - test_query_router_repo_meta.py
      - public_tests/state/test_repo_meta_time_route_contract.py
    task_card:
      - docs/task_card_repo_meta_time_route_scope_fix.yaml
  conditional_allow:
    - file: ai/repo_meta/classifier.py
      default_permission: denied
      preflight_evidence:
        status: obtained_by_read_only_probe
        question: "最近合同到期吗？"
        looks_like_time_request: false
        classify_repo_meta_question: time
        implication: 通用 TIME_KEYWORDS/RULES 可绕过收窄后的 predicate
      enable_only_if:
        - 已有只读 preflight 证据证明 TIME_KEYWORDS/RULES 存在绕过风险
        - 先红的 tracked public contract 能稳定证明该不一致
        - 修改仅限消除与统一时间 predicate 冲突的宽泛兜底
      forbidden_even_when_enabled:
        - 修改非 time topic
        - 重排整体 classifier
        - 新增业务领域词
      record_requirement: >-
        该文件仍非默认授权。实施回执必须同时给出上述只读证据和 tracked 红测
        失败摘要，才可启用；若 tracked 测试不能稳定证明绕过，不得触碰该文件。
  read_only_supporting_tests:
    - tests/repo_meta/routing/test_routing_core_meta_rules.py
    - tests/repo_meta/routing/test_routing_core_router_guards.py
    - tests/file_actions/test_file_change_event_semantics.py
  read_only_formal_regressions:
    - public_tests/file_actions/test_file_change_event_contract.py
    - public_tests/domain/test_domain_dispatch_port_empty_host.py
    - public_tests/state/test_dialog_state_transition_contract.py
    - public_tests/domain/test_recruitment_jd_slice_contract.py
  public_test_path_decision: >-
    现有 public state test 只覆盖 apply_event_to_state，现有 public Domain test
    只覆盖 Host/runner 契约，均不适合混入新的时间意图断言。因此唯一授权新增
    public_tests/state/test_repo_meta_time_route_contract.py，作为 tracked 的公开路由契约；
    不授权 public_tests/** 通配范围。
  deny:
    - app/chat_loop_parts/runner.py
    - ask_notes.py
    - app/chat_loop_llm.py
    - app/retrieval_flow/**
    - app/file_actions/**
    - app/file_flows/**
    - ai/prompt_builder.py
    - ai/repo_meta/answering_parts/time.py
    - retrieval/**
    - bootstrap/**
    - packages/docmind-domain-sdk/**
    - packages/docmind-recruitment-plugin/**
    - app/domain_dispatch_port.py
    - app/domain_host/**
    - public_tests/domain/**
    - public_tests/file_actions/**
    - public_tests/retrieval/**
    - public_tests/state/test_dialog_state_transition_contract.py
    - tests/**
    - requirements.txt
    - .venv/**
    - test_notes/**
    - cache/**
    - README*
    - WorkState**
    - .gitignore
  resolution: >-
    tests/** 虽可运行作本地辅助回归，但由 .gitignore 排除，不得修改、暂存或作为
    正式交付证据。正式失败与通过证据必须落在列明的 tracked 根测试和唯一 public
    路由契约文件中。任何 deny 路径若被证明必改，立即停止并申请新授权。

non_goals:
  - 招聘 JD 识别、字段抽取、插件规则或插件路由
  - Domain SDK、Domain Host、StaticDomainHost 或 handled result 语义
  - 汽车插件、汽车关键词、汽车 Prompt、维修诊断能力或新汽车语料
  - 自然语言日期范围解析
  - “上周”的真实日期过滤
  - file_change_history 的按周、按月或区间过滤
  - 新的时间计算或日期解析模块
  - 修复真实入口在全部复用时仍重写语义等价 brain_cache.npz
  - 修改索引格式、索引可复现性或缓存写入策略
  - 重写整个状态机或调整 runner 路由顺序
  - 修改普通 retrieval、Embedding、Gemini、Prompt 或生成配置
  - 引入 LLM 意图分类器、远程搜索、Grounding、URL Context 或新外部服务
  - 新增配置开关、业务词典或行业黑名单
  - 动态插件发现、多插件仲裁、MCP、生命周期或运行时治理
  - 顺手修复未列入本卡验收的相邻路由问题

preflight_revision:
  prior_formal_preflight:
    status: BLOCKED
    sole_blocker: >-
      任务卡曾把有 repo-meta 文件结果集上下文的“最近的呢？”误列为修复前既有绿
      能力；只读探针证明状态机为 unknown/None、classifier 为 time。
    passed_baselines:
      - repo-meta 本地辅助测试：50 passed
      - tracked repo-meta 测试：5 passed
      - 文件历史测试：7 passed
      - runner/状态公开契约测试：41 passed
      - 招聘插件回归：7 passed
      - public tests：54 passed
      - tracked pytest：173 passed
      - 六文档数量与 SHA-256 全部匹配
      - 原索引两个文件的 SHA-256 全部匹配
      - before_fix 指定记录完整且可读
    reuse_policy: >-
      本次仅修订任务卡，不推翻上述已通过结果；修订后先重跑 focused_rerun。
      生产代码实施完成后，quality_gate 中的完整测试与完整性检查仍必须全部重跑。

preflight_checks:
  mode_after_card_revision: focused_rerun
  focused_rerun:
    - id: repository_state
      command: >-
        git branch --show-current &&
        git rev-parse HEAD &&
        git status --short &&
        git diff --check &&
        git rev-list --left-right --count origin/arch/domain-plugin-spike...HEAD
      pass: 分支与授权实施分支一致；无非预期修改；暂存区为空
    - id: card_integrity_and_authorization
      checks:
        - YAML 可解析且无重复 key
        - 默认生产文件、条件性文件、tracked 测试和 deny 范围与本卡一致
        - implementation_status 仍为 ready_for_implementation_after_preflight
      pass: 授权没有因基线修订而扩大
    - id: recent_short_followup_context_split
      checks:
        - >-
          有 repo-meta 文件结果集上下文时，“最近的呢？”当前状态机为
          unknown/None、classifier 为 time，作为 tracked 先红缺口
        - >-
          fresh state 时，“最近的呢？”当前不产生 repo-meta route hint；
          修复目标还要求 classifier 不得把它认定为文件元数据 time
      pass: 有上下文和无上下文的预期明确、互不混用
    - id: classifier_generic_rules_bypass
      checks:
        - “最近合同到期吗？”的 looks_like_time_request 为 false
        - 同一问句的 classify_repo_meta_question 为 time
      pass: 条件性 classifier 文件具有只读证据，但仍须 tracked 红测才可启用
    - id: tracked_red_test_locations
      checks:
        - 现有 tracked 守门文件为 test_query_router_repo_meta.py
        - 唯一允许新增的公开契约为 public_tests/state/test_repo_meta_time_route_contract.py
        - 不修改 Git 忽略的 tests/**
      pass: 真实公开路由边界可由精确授权路径覆盖
  post_preflight_red_gate:
    id: create_red_contract
    action: >-
      focused_rerun 通过后、任何生产修改前，在唯一授权 tracked 测试路径建立
      全部先红和相邻绿边界，并保存失败摘要。
    expected_red:
      - 原始 Q1 因当前错误 repo-meta 路由而失败
      - 合同正文时间因当前错误 repo-meta 路由而失败
      - 课程周期因当前错误 repo-meta 路由而失败
      - 六月以后新增笔记因当前错误 normal retrieval 路由而失败
      - >-
        有 repo-meta 文件结果集上下文时，“最近的呢？”因状态机未产生
        repo-meta route hint 而失败；classifier 当前为 time，证明两者不一致
      - >-
        “最近合同到期吗？”的 looks_like_time_request 为 false，但
        classify_repo_meta_question 为 time，证明通用 fallback 绕过 predicate
    adjacent_green:
      - 这份合同文档什么时候到期保持 normal retrieval
      - fresh state 的“最近的呢？”保持不产生 repo-meta route hint
      - 有 repo-meta 文件结果集上下文的“最近的有哪些？”保持 repo_meta/time
      - 有 repo-meta 文件结果集上下文的“最近时间有哪些？”保持 repo_meta/time
      - 文档创建时间保持 repo_meta/time
      - 最近修改、上周修改和最近删除保持现有文件历史或文件时间能力
      - 最新、最早和现有明确日期文件列表保持 repo_meta/time
  scope_proof:
    pass:
      - 不需要修改 runner
      - 不需要修改 ask_notes.py
      - 不需要修改日期回答器
      - 不需要修改普通 retrieval
      - 不需要业务领域黑名单
    failure: 命中 stop_conditions，不开始生产修改
  probe_policy: >-
    focused_rerun 可使用只读代码分析、现有日志、pytest fake/spy 和仓库外临时
    探针；不得修改问题、语料、索引、Prompt、模型或依赖来制造结果。

test_contract:
  red_before_implementation:
    - id: original_automotive_content_time
      question: "定期保养在什么时间或里程条件下进行？特殊使用条件会带来什么变化？"
      before: repo_meta/time
      after: normal_retrieval
      assertion: 不被 repo-meta handler 消费，并继续原 normal retrieval 路径
    - id: contract_content_expiry
      question: "合同在什么时间到期？"
      before: repo_meta/time
      after: normal_retrieval
    - id: recurring_course_time
      question: "课程每隔多长时间安排一次？"
      before: repo_meta/time
      after: normal_retrieval
    - id: note_added_since_month
      question: "找出六月以后新增的笔记。"
      before: normal_retrieval
      after: repo_meta_file_time
      boundary: 只验路由归属，不验“六月以后”的实际日期过滤
    - id: contextual_recent_short_followup
      question: "最近的呢？"
      state_requirement: 上一轮已经形成 repo-meta 文件结果集
      before:
        state_machine: unknown/None
        classifier: time
      after:
        state_machine: repo-meta route hint
        classifier: time
        route: repo_meta/time
      boundary: 只有已有 repo-meta 文件结果集上下文时成立
    - id: classifier_generic_time_fallback
      question: "最近合同到期吗？"
      before:
        looks_like_time_request: false
        classify_repo_meta_question: time
      after:
        classify_repo_meta_question: 不得因通用 TIME_KEYWORDS/RULES 返回 time
      boundary: classifier 不得绕过统一的文件时间 predicate
  green_positive_routes:
    - question: "这份文档是什么时间创建的？"
      expected: repo_meta/time
    - question: "最近修改了哪些文件？"
      expected: file_change_history_or_existing_file_time_route
    - question: "上周修改了哪些文件？"
      expected: file_change_history
      excluded_assertion: 不断言按上周过滤
    - question: "最近删除了哪些文件？"
      expected: file_change_history
    - question: "最新的文件是什么？"
      expected: repo_meta/time
    - question: "最早的文件是什么？"
      expected: repo_meta/time
    - question: "3月25号还有其他文件吗？"
      expected: repo_meta/time
    - question: "最近的有哪些？"
      state_requirement: 上一轮为 repo-meta 文件结果集
      expected: repo_meta/time
    - question: "最近时间有哪些？"
      state_requirement: 上一轮为 repo-meta 文件结果集
      expected: repo_meta/time
  green_content_routes:
    - question: "电池一般多久检查一次？"
      expected: normal_retrieval
    - question: "这个项目计划什么时候完成？"
      expected: normal_retrieval
    - question: "这份合同文档什么时候到期？"
      expected: normal_retrieval
      boundary: 含“文档”不等于文件元数据意图
  green_negative_routes:
    - id: fresh_recent_short_followup
      question: "最近的呢？"
      state_requirement: fresh state，没有 repo-meta 文件结果集
      current_route_boundary: 状态机不产生 repo-meta route hint
      classifier_alignment_gap: 当前 classifier 为 time，由通用 fallback 红测负责修复
      expected_after:
        state_machine: 不产生 repo-meta route hint
        classifier: 不得认定为文件元数据 time
        route: 普通对话或 normal retrieval 边界
      boundary: 无上下文的“最近”不能独立触发文件时间路由
  runner_or_public_contract:
    primary: public_tests/state/test_repo_meta_time_route_contract.py
    requirements:
      - 使用真实 detect_dialog_event 与 classify_repo_meta_question，不复制生产 predicate
      - 覆盖 fresh state 与 repo-meta 文件结果集 follow-up state
      - >-
        有 repo-meta 文件结果集上下文的“最近的呢？”必须由状态机和 classifier
        一致判为 repo_meta/time
      - >-
        fresh state 的“最近的呢？”不得由状态机或 classifier 判为文件元数据时间请求
      - 对正文时间问题断言 normal_retrieval 边界
      - 对文件元数据问题断言 repo_meta/time 边界
      - 不调用真实 Ollama、Gemini、网络或外部服务
    tracked_router_guard: test_query_router_repo_meta.py
    runner_regression_read_only: public_tests/domain/test_domain_dispatch_port_empty_host.py
  implementation_invariants:
    - 文件变更历史 guard 继续早于状态机处理修改、删除历史问题
    - 普通 normal retrieval 的输入、参数和行为保持不变
    - RecruitmentJDPlugin 对非 JD 请求继续 abstain
    - Domain Host、runner 与 handled result 语义保持不变
    - 状态机与 classifier 对同一文件时间意图给出一致结论
    - 不得只修状态机或只修 classifier
    - 普通无状态“最近”不得触发 repo-meta 文件时间路由
    - 不以业务领域词决定路由

implementation_plan:
  - step: 1
    action: 完成 preflight_checks.focused_rerun
    gate: 上下文分流、classifier 绕过证据、授权或 Git 状态不一致时停止
  - step: 2
    action: >-
      建立 post_preflight_red_gate 的 tracked 先红契约，并在仓库外临时目录保存
      既有 *.pyc、*.pyo、*.npz 的相对路径和 SHA-256 清单
    gate: 未见预期红测、相邻绿边界不绿或产生仓库内缓存时停止
  - step: 3
    action: >-
      在 app/dialog/repo_meta_rules.py 收窄确定性时间 guard，
      用文件范围、元数据动作/排序和查询形状的正向合取替代无对象宽判；
      仅在已有 repo-meta 文件结果集上下文时支持“最近的呢？”排序短追问
    constraint: 不改变 state machine 顺序，不增加行业反证词
  - step: 4
    action: >-
      在 ai/repo_meta/classifier_predicates.py 对齐 classifier predicate，
      保留明确日期文件列表和有上下文短追问，并拒绝 fresh-state 的孤立“最近”
    constraint: 不修改日期回答器
  - step: 5
    action: >-
      重新运行 tracked 红测；在已有只读证据基础上，只有 tracked 测试仍稳定证明
      TIME_KEYWORDS/RULES 绕过 predicate 时，才按 conditional_allow 最小修改
      ai/repo_meta/classifier.py
    gate: 无 tracked 失败证据则不得启用条件性文件
  - step: 6
    action: 运行全部质量门、真实 Q1 after_fix 和可选六题回归
    constraint: 不改写问题、不调参、不覆盖历史记录
  - step: 7
    action: 审查完整 diff、修改范围、after_fix 比较和缓存清单
    constraint: 保持未提交状态，等待用户终审与后续提交授权

quality_gate:
  environment_contract:
    interpreter: .venv/bin/python
    pythonpath: unset
    bytecode: disabled
    package_expectation:
      - docmind-domain-sdk 已以非 editable 方式安装于当前 .venv
      - docmind-recruitment-plugin 已以非 editable 方式安装于当前 .venv
    network: 单元与 public tests 不调用真实网络或模型
  yaml_and_card:
    command: |
      env -u PYTHONPATH .venv/bin/python - <<'PY'
      from pathlib import Path
      import yaml

      class UniqueKeyLoader(yaml.SafeLoader):
          pass

      def construct_unique_mapping(loader, node, deep=False):
          result = {}
          for key_node, value_node in node.value:
              key = loader.construct_object(key_node, deep=deep)
              if key in result:
                  raise ValueError(f"duplicate YAML key: {key!r}")
              result[key] = loader.construct_object(value_node, deep=deep)
          return result

      UniqueKeyLoader.add_constructor(
          yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
          construct_unique_mapping,
      )
      path = Path("docs/task_card_repo_meta_time_route_scope_fix.yaml")
      yaml.load(path.read_text(encoding="utf-8"), Loader=UniqueKeyLoader)
      PY
  static_compile:
    command: >-
      env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1
      .venv/bin/python -m py_compile
      app/dialog/repo_meta_rules.py
      ai/repo_meta/classifier_predicates.py
      ai/repo_meta/classifier.py
      test_query_router_repo_meta.py
      public_tests/state/test_repo_meta_time_route_contract.py
  targeted_repo_meta_local_support:
    command: >-
      env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1
      .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/repo_meta/routing/test_routing_core_meta_rules.py
      tests/repo_meta/routing/test_routing_core_router_guards.py
    evidence_role: 本地辅助回归；不得修改或提交 tests/**
  targeted_tracked_route:
    command: >-
      env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1
      .venv/bin/python -m pytest -q -p no:cacheprovider
      test_query_router_repo_meta.py
      public_tests/state/test_repo_meta_time_route_contract.py
  file_history_regression:
    command: >-
      env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1
      .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/file_actions/test_file_change_event_semantics.py
      public_tests/file_actions/test_file_change_event_contract.py
    evidence_role: public_tests 文件为正式证据；tests 文件只作本地辅助
  runner_and_plugin_regression:
    command: >-
      env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1
      .venv/bin/python -m pytest -q -p no:cacheprovider
      public_tests/domain/test_domain_dispatch_port_empty_host.py
      public_tests/domain/test_recruitment_jd_slice_contract.py
      public_tests/domain/test_recruitment_jd_production_wiring_contract.py
  public_tests_all:
    command: >-
      env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1
      .venv/bin/python -m pytest -q -p no:cacheprovider public_tests
  tracked_pytest_all:
    command: >-
      env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1
      .venv/bin/python -m pytest -q -p no:cacheprovider
      $(git ls-files '*.py' | rg '(^|/)test_.*\\.py$')
    pass: 所有 tracked pytest 通过
  diff_checks:
    commands:
      - git diff --check
      - git diff --name-only
      - git status --short
    pass: 仅出现 editable_scope 实际启用的文件
  encoding_and_newline:
    command: >-
      env -u PYTHONPATH .venv/bin/python -c
      "from pathlib import Path; paths=[Path(p) for p in ['app/dialog/repo_meta_rules.py','ai/repo_meta/classifier_predicates.py','test_query_router_repo_meta.py','public_tests/state/test_repo_meta_time_route_contract.py']]; [p.read_text(encoding='utf-8') for p in paths]; assert all(b'\\0' not in p.read_bytes() and p.read_bytes().endswith(b'\\n') for p in paths)"
    pass: UTF-8 可解码、无 NUL、末尾换行完整
  mojibake_scan:
    command: |
      env -u PYTHONPATH .venv/bin/python - <<'PY'
      from pathlib import Path

      paths = [
          Path("app/dialog/repo_meta_rules.py"),
          Path("ai/repo_meta/classifier_predicates.py"),
          Path("ai/repo_meta/classifier.py"),
          Path("test_query_router_repo_meta.py"),
          Path("public_tests/state/test_repo_meta_time_route_contract.py"),
      ]
      needles = [
          "AI\u9365\u70b5\u74df",
          "\u9983",
          "\u9234\u618b\u7b0d",
          "\u923f\u72c5\u7b0d",
          "\u8930\u64b3\u58a0\u6769\u6a3b\u75c5\u93c8",
          "\u951b?",
          "\u9286?",
      ]
      findings = [
          (str(path), index, needle)
          for path in paths
          for index, line in enumerate(
              path.read_text(encoding="utf-8").splitlines(),
              start=1,
          )
          for needle in needles
          if needle in line
      ]
      assert not findings, findings
      PY
    pass: 0 命中
  cache_scan:
    action: >-
      使用与 preflight 相同的 find、相对路径和 SHA-256 规则重新生成仓库外临时清单，
      与 cache_inventory_baseline 逐行比较。
    pass: 两份清单完全一致；不新增、删除或改写用户既有缓存与索引
  privacy_scan:
    command: |
      env -u PYTHONPATH .venv/bin/python - <<'PY'
      from pathlib import Path
      import re

      paths = [
          Path("app/dialog/repo_meta_rules.py"),
          Path("ai/repo_meta/classifier_predicates.py"),
          Path("ai/repo_meta/classifier.py"),
          Path("test_query_router_repo_meta.py"),
          Path("public_tests/state/test_repo_meta_time_route_contract.py"),
          Path("docs/task_card_repo_meta_time_route_scope_fix.yaml"),
      ]
      patterns = [
          re.compile("/" + "home/"),
          re.compile("/" + "Users/"),
          re.compile(r"[A-Za-z]:\\\\" + r"Users\\\\"),
          re.compile("AI" + r"za[0-9A-Za-z_-]{20,}"),
          re.compile("s" + r"k-[0-9A-Za-z_-]{20,}"),
          re.compile(r"1[3-9][0-9]{9}"),
      ]
      findings = [
          (str(path), index, pattern.pattern)
          for path in paths
          for index, line in enumerate(
              path.read_text(encoding="utf-8").splitlines(),
              start=1,
          )
          for pattern in patterns
          if pattern.search(line)
      ]
      assert not findings, findings
      PY
    pass: 0 命中
  scope_scan:
    command: >-
      git diff --name-only |
      .venv/bin/python -c
      "import sys; allowed={'app/dialog/repo_meta_rules.py','ai/repo_meta/classifier_predicates.py','ai/repo_meta/classifier.py','test_query_router_repo_meta.py','public_tests/state/test_repo_meta_time_route_contract.py','docs/task_card_repo_meta_time_route_scope_fix.yaml'}; seen={x.strip() for x in sys.stdin if x.strip()}; bad=seen-allowed; assert not bad, sorted(bad)"
  prohibited_business_term_guard: >-
    人工复核生产 diff：不得新增以“保养、里程、合同、课程、轮胎、汽车”等业务词
    参与路由判定的常量、正则或分支。测试问句和任务卡基线描述不受此限制。

after_fix_regression:
  root: test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/regression_q1_time_route/after_fix
  git_policy: 本地忽略产物，不暂存、不提交
  preserve:
    - test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/regression_q1_time_route/before_fix
    - test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/runs
    - test_notes/automotive_maintenance_adaptation_2026-07-22-evaluation/final_report.md
  minimum_files:
    - repository_state.md
    - environment.md
    - q1_input.txt
    - q1_stdout.txt
    - q1_stderr.txt
    - route_evidence.md
    - comparison.md
    - regression_summary.md
  q1:
    question: "定期保养在什么时间或里程条件下进行？特殊使用条件会带来什么变化？"
    requirements:
      - 通过真实 ask_notes.py 默认生产入口
      - 使用原六文档纯语料
      - 使用全新进程和会话
      - 问题逐字符不变
      - 不修改语料、Prompt、模型或参数
      - 不事后调参或重答
      - 保存 stdout、stderr、路由证据和与 before_fix 的比较
      - 不覆盖 before_fix 或首次行业评测记录
    cache_write_isolation: >-
      如默认入口仍会写回语义等价 NPZ，只能复用 before_fix 已采用的仓库外影子缓存
      隔离方法；不得在本任务中修改缓存写入实现。
  full_six_question_regression:
    recommendation: Q1 真实回归通过后执行
    required_for_core_fix_acceptance: false
    requirements:
      - 六题文字与首次正式评测一致
      - 结果独立保存于 after_fix
      - 原始失败和首次评测记录保持不变
      - 不用新结果回写或篡改第一次正式评测

acceptance_min:
  routing:
    - 原始 Q1 不再进入 repo_meta/time，并继续 normal retrieval
    - 合同在什么时间到期进入 normal retrieval
    - 课程每隔多长时间安排一次进入 normal retrieval
    - 这份合同文档什么时候到期保持 normal retrieval
    - 找出六月以后新增的笔记进入 repo-meta 文件时间路由
    - 文档创建、文件修改、文件删除、最新、最早和明确日期文件列表保持正确路由
    - >-
      上一轮已形成 repo-meta 文件结果集时，“最近的呢？”由状态机产生
      repo-meta route hint，classifier 返回 time，最终进入 repo_meta/time
    - >-
      fresh state、没有 repo-meta 文件结果集时，“最近的呢？”不产生 repo-meta
      route hint，classifier 不把它认定为文件元数据 time
    - 有 repo-meta 文件结果集上下文的“最近的有哪些？”和“最近时间有哪些？”保持 repo_meta/time
  implementation_boundary:
    - 状态机与 classifier 时间语义一致
    - 有上下文与 fresh-state 的“最近的呢？”在两层判定中均符合各自边界
    - 不得只修状态机或只修 classifier
    - 普通无状态“最近”不得触发 repo-meta 文件时间路由
    - 不存在汽车、保养、合同、课程或其他业务词黑名单
    - runner、ask_notes.py、普通 retrieval、日期回答器均无修改
    - Domain SDK、Host、招聘插件链和 handled result 语义无修改
    - 模型、Prompt、依赖、语料、索引无修改
  tests:
    - 先红 tracked 契约在修复后全部通过
    - repo-meta 与 classifier 定向测试通过
    - 文件操作与历史回归通过
    - public 路由契约通过
    - runner 与招聘插件 public 回归通过
    - 全部 public_tests 通过
    - 全部 tracked pytest 通过
    - py_compile、diff、编码、缓存、隐私与范围检查通过
  real_regression:
    - after_fix Q1 使用原问题和真实默认入口完成
    - before_fix 与首次行业评测记录未被覆盖
  reporting:
    - 明确列出实际修改文件与 conditional_allow 是否启用
    - 给出红测、绿测、全量测试和真实回归结果
    - 不宣称扩展了日期解析、汽车能力或生产级行业能力

privacy_guard:
  prohibited:
    - 用户姓名
    - 本机用户名
    - 本机绝对路径
    - API key
    - Cookie
    - 登录凭证
    - 真实车辆或维修记录
    - 非必要个人资料
  allowed_examples:
    - 某公司A
    - 示例文档甲
    - name@example.com
  raw_log_policy: >-
    after_fix 原始本地日志如自然包含绝对路径，只能保存在 Git 忽略目录；
    对外 Markdown 使用 <repo> 或相对路径，凭证必须始终打码。

stop_conditions:
  - 发现非预期用户改动或开始时工作区不干净
  - 原始 Q1 在实施前不再复现
  - before_fix 记录缺失、被修改或与当前基线不一致
  - 六文档语料哈希不一致
  - 必须修改 app/chat_loop_parts/runner.py
  - 必须修改 ask_notes.py
  - 必须修改普通 retrieval
  - 必须修改 Prompt、Embedding、Gemini 或模型配置
  - 必须修改 ai/repo_meta/answering_parts/time.py 或其他日期回答器
  - 必须扩展 file_change_history 的“上周”过滤
  - 必须新增自然语言日期解析或时间计算模块
  - 必须加入行业词、业务黑名单或汽车专有规则
  - 必须修改汽车语料、索引、before_fix 或首次行业评测记录
  - 状态机与 classifier 无法在默认两个生产文件及有证据的条件性文件内保持一致
  - 文件创建、修改、删除、最新、最早或明确日期正例大面积回归
  - >-
    无法同时让有 repo-meta 文件结果集上下文的“最近的呢？”进入 repo_meta/time，
    并让 fresh-state 同句保持在 repo-meta 之外
  - 必须让普通无状态“最近”触发 repo-meta 才能保留上下文短追问
  - 必须整体重构状态机或改变 runner 路由顺序
  - 必须修改 Domain SDK、Host、招聘插件或 handled result 链
  - 必须新增配置开关、联网搜索、远程工具或外部服务
  - tracked 红测无法稳定复现已审计缺陷
  - 需要修改 editable_scope.deny 中任何路径
  - 完整质量门失败且原因无法在授权范围内修复
  - after_fix 需要改写问题、修改语料或事后调参才能通过
  - 任一停止条件触发后不得提交部分修复

implementation_permissions:
  granted_when:
    - 本任务卡已合入当前实施分支
    - preflight_checks.focused_rerun 全部通过
    - preflight_checks.post_preflight_red_gate 已建立并保存失败摘要
    - 未命中 stop_conditions
  allowed_actions:
    - 在 default_allow 内实施最小 Core 路由修复
    - 满足并记录条件后启用 ai/repo_meta/classifier.py
    - 运行本任务卡列出的只读探针与质量门
    - 创建 Git 忽略的 after_fix 本地回归记录
  not_granted:
    - 任何 deny 路径修改
    - Git add、commit、push 或开 PR；仍需用户另行明确授权
    - 用“必要修改”扩张路径
    - 覆盖历史评测或审计记录

deliverables:
  tracked:
    - 授权范围内的最小生产修改
    - test_query_router_repo_meta.py 的必要 tracked 守门测试
    - public_tests/state/test_repo_meta_time_route_contract.py
    - 仅在需要记录实施事实时更新本任务卡
  local_ignored:
    - after_fix 修复后真实回归记录
  forbidden:
    - tests/** 修改或提交
    - 语料、索引、依赖或环境改动

commit_message:
  suggested_title: "fix(core): 收窄文件时间路由边界并保留元数据查询"
  required_body:
    - "目标: 普通业务时间问题进入正文检索，真实文件元数据时间查询保持可用。"
    - "手段: 统一状态机与 classifier 的正向意图合取，并补充 tracked 跨域路由契约。"
